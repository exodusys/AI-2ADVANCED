/* --- Vortex selector overlay --- */
.vortex-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);display:flex;align-items:flex-start;justify-content:center;padding-top:96px;z-index:84;padding-left:16px;padding-right:16px}
.vortex-overlay[hidden]{display:none}
.vortex-panel{width:min(520px,calc(100vw - 32px));background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:messageIn 0.35s cubic-bezier(0.16,1,0.3,1);max-height:min(78vh,680px)}
.vortex-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:0.9rem}
.vortex-close{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vortex-list{display:flex;flex-direction:column;gap:8px;padding:12px;overflow-y:auto}
.vortex-footer{border-top:1px solid var(--border);padding:10px 14px;text-align:center}
.vortex-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:all 0.2s;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.vortex-item:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.vortex-item.active{border-color:#3b82f6;background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(59,130,246,0.15))}
.vortex-preview{width:48px;height:48px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vortex-preview-core{width:12px;height:12px;border-radius:50%;position:relative;z-index:2}
.vortex-item-html,body{background:#0a0a0a !important;background-color:#0a0a0a !important;margin:0 !important;padding:0 !important;overscroll-behavior:none !important} body{flex:1;min-width:0}
.vortex-item-title{font-weight:600;font-size:0.9rem}
.vortex-item-desc{font-size:0.73rem;color:var(--text-muted);margin-top:2px;line-height:1.3}

/* --- 25 Vortex themes espace/planètes --- */
.welcome-icon{transition:all 0.5s ease}
.welcome-icon .vortex span, .welcome-icon .vortex2 span, .welcome-icon .vortex-core{transition:all 0.5s ease}

/* 1 - Défaut Orange Feu */
.welcome-icon.vortex-default .vortex-core{background: radial-gradient(circle, #fff 0%, #ff9a6b 35%, #ff6b35 70%, transparent 100%);box-shadow: 0 0 10px rgba(255,107,53,0.8), 0 0 20px rgba(255,107,53,0.4), 0 0 30px rgba(255,107,53,0.2)}
.welcome-icon.vortex-default .vortex span{background:white;box-shadow:0 0 6px rgba(255,255,255,0.9), 0 0 12px rgba(255,107,53,0.6)}
.welcome-icon.vortex-default .vortex2 span{background:#ffd6c2}

/* 2 - Nébuleuse Bleue */
.welcome-icon.vortex-nebula .vortex-core{background: radial-gradient(circle, #fff 0%, #93c5fd 30%, #3b82f6 70%, transparent 100%);box-shadow:0 0 12px rgba(59,130,246,0.9),0 0 24px rgba(59,130,246,0.5)}
.welcome-icon.vortex-nebula .vortex span{background:#bfdbfe;box-shadow:0 0 6px #fff,0 0 12px #3b82f6}
.welcome-icon.vortex-nebula .vortex2 span{background:#60a5fa}

/* 3 - Aurore Boréale */
.welcome-icon.vortex-aurora .vortex-core{background: radial-gradient(circle, #fff 0%, #6ee7b7 30%, #10b981 70%, transparent 100%);box-shadow:0 0 12px rgba(16,185,129,0.9),0 0 24px rgba(16,185,129,0.5)}
.welcome-icon.vortex-aurora .vortex span{background:#a7f3d0;box-shadow:0 0 6px #fff,0 0 12px #10b981}
.welcome-icon.vortex-aurora .vortex2 span{background:#34d399}

/* 4 - Galaxie Violette */
.welcome-icon.vortex-galaxy .vortex-core{background: radial-gradient(circle, #fff 0%, #c4b5fd 30%, #8b5cf6 70%, transparent 100%);box-shadow:0 0 12px rgba(139,92,246,0.9),0 0 24px rgba(139,92,246,0.5)}
.welcome-icon.vortex-galaxy .vortex span{background:#ddd6fe;box-shadow:0 0 6px #fff,0 0 12px #8b5cf6}
.welcome-icon.vortex-galaxy .vortex2 span{background:#a78bfa}

/* 5 - Soleil Rouge */
.welcome-icon.vortex-sun .vortex-core{background: radial-gradient(circle, #fff 0%, #fca5a5 30%, #ef4444 70%, transparent 100%);box-shadow:0 0 12px rgba(239,68,68,0.9),0 0 24px rgba(239,68,68,0.5)}
.welcome-icon.vortex-sun .vortex span{background:#fecaca;box-shadow:0 0 6px #fff,0 0 12px #ef4444}
.welcome-icon.vortex-sun .vortex2 span{background:#f87171}

/* 6 - Océan Cyan */

/* --- Background selector overlay --- */
.bg-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);display:flex;align-items:flex-start;justify-content:center;padding-top:96px;z-index:84;padding-left:16px;padding-right:16px}
.bg-overlay[hidden]{display:none}
.bg-panel{width:min(560px,calc(100vw - 32px));background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:messageIn 0.35s cubic-bezier(0.16,1,0.3,1);max-height:min(80vh,720px)}
.bg-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:0.9rem}
.bg-close{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bg-list{display:flex;flex-direction:column;gap:8px;padding:12px;overflow-y:auto}
.bg-footer{border-top:1px solid var(--border);padding:10px 14px;text-align:center}
.bg-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:all 0.2s;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.bg-item:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.bg-item.active{border-color:#3b82f6;background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(59,130,246,0.15))}
.bg-preview{width:52px;height:32px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden;border:1px solid var(--border);background:var(--bg)}
.bg-item-html,body{background:#0a0a0a !important;background-color:#0a0a0a !important;margin:0 !important;padding:0 !important;overscroll-behavior:none !important} body{flex:1;min-width:0}
.bg-item-title{font-weight:600;font-size:0.88rem}
.bg-item-desc{font-size:0.72rem;color:var(--text-muted);margin-top:2px;line-height:1.3}

/* --- Container for animated AI backgrounds --- */
#aiBg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:1;transition:opacity 0.5s}
#aiBg .ai-layer{position:absolute;inset:0}

/* Default - original */
body.bg-ai-default #aiBg{opacity:0}

/* 1 - Neural Network */
body.bg-ai-neural #aiBg{background: #0b0b0f}
body.bg-ai-neural #aiBg::before{content:'';position:absolute;inset:-20%;background-image: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.4) 0 2px, transparent 3px), radial-gradient(circle at 80% 20%, rgba(16,185,129,0.4) 0 2px, transparent 3px), radial-gradient(circle at 50% 80%, rgba(139,92,246,0.4) 0 2px, transparent 3px), radial-gradient(circle at 10% 90%, rgba(236,72,153,0.3) 0 2px, transparent 3px); animation: neuralMove 12s ease-in-out infinite alternate}
body.bg-ai-neural #aiBg::after{content:'';position:absolute;inset:0;background: linear-gradient(90deg, transparent 49%, rgba(59,130,246,0.15) 50%, transparent 51%), linear-gradient(30deg, transparent 49%, rgba(16,185,129,0.1) 50%, transparent 51%); animation: neuralPulse 4s ease-in-out infinite}
@keyframes neuralMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(20px,-20px) scale(1.1)}}
@keyframes neuralPulse{0%,100%{opacity:0.5}50%{opacity:1}}

.message.assistant .bubble{

  border:1px solid var(--assistant-border);

}

#messages{
  flex:1;
  overflow-y:auto;
  padding:28px 4px 16px;
  display:flex;
  flex-direction:column;
  gap:20px;
  min-height:0;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
;background:#0a0a0a !important}

.message{display:flex;flex-direction:column;gap:6px;max-width:82%;animation:messageIn 0.35s ease}
@keyframes messageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;align-items:flex-end}
.message.assistant{align-self:flex-start;align-items:flex-start}
.bubble-wrap{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;width:100%;max-width:100%}
.bubble{padding:14px 18px;border-radius:var(--radius);line-height:1.6;font-size:0.935rem;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-sm)}
.message.user .bubble{background:var(--user-bg);border:1px solid var(--user-border);border-bottom-right-radius:4px}
.message.assistant .bubble{background:var(--assistant-bg);border:1px solid var(--assistant-border);border-bottom-left-radius:4px}
.message.error .bubble{background:var(--error-bg);border:1px solid var(--error);color:var(--error-text)}
.copy-btn{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:0.75rem;padding:5px 10px;border-radius:8px;cursor:pointer;opacity:1;transition:all 0.2s;font-family:inherit;margin-top:4px;display:inline-flex;align-items:center;gap:4px}.copy-btn:hover{background:var(--surface-3, var(--surface-2));border-color:var(--border-strong);color:var(--text);transform:translateY(-1px)}.copy-btn.copied{background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.4);color:#22c55e}
.message:hover .copy-btn{opacity:1;}
.message.user .copy-btn{align-self:flex-end}
.avatar{display:none !important}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing span{width:7px;height:7px;background:var(--text-muted);border-radius:50%;animation:bounce 1.3s infinite}
.typing span:nth-child(2){animation-delay:0.15s}.typing span:nth-child(3){animation-delay:0.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.35}30%{transform:translateY(-6px);opacity:1}}

.input-area{padding:10px 0 max(10px, env(safe-area-inset-bottom));background:#0a0a0a !important;background-color:#0a0a0a !important;flex-shrink:0;position:relative;z-index:10;width:100%;margin-bottom:0 !important;border-top:1px solid var(--border);backdrop-filter:none !important}

.input-wrapper{display:flex;gap:8px;background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;padding:8px;align-items:flex-end;box-shadow:var(--shadow);margin-bottom:6px}
.input-wrapper:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),var(--shadow)}
#userInput{flex:1;background:transparent;border:none;color:var(--text);font-size:0.95rem;padding:12px 14px;resize:none;max-height:160px;outline:none;font-family:inherit;line-height:1.5}
#userInput::placeholder{color:var(--text-muted);opacity:0.7}
#sendBtn{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.15rem;flex-shrink:0}
.icon-btn{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.2rem;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all 0.2s}
.icon-btn:disabled{opacity:0.45}
.hint{text-align:center;font-size:0.68rem;color:var(--text-muted);margin-top:4px;opacity:0.7}
.welcome{text-align:center;padding:80px 24px 40px;color:var(--text-muted)}
.welcome-icon{
  width:88px;height:88px;margin:0 auto 20px;position:relative;
  border-radius:50%;flex-shrink:0;
  background: radial-gradient(circle at 50% 50%, rgba(255,107,53,0.15), transparent 70%);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.vortex{
  position:absolute;inset:-30%;
  transform: scale(1.8);
  animation: vortexRotate 18s linear infinite;
}
.vortex span{
  position:absolute;left:50%;top:50%;
  width:3.5px;height:3.5px;background:white;border-radius:50%;
  box-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 12px rgba(255,107,53,0.6);
  transform-origin: 0 0;
}
.vortex span:nth-child(1){ transform: rotate(0deg) translateX(44px); opacity:0.9; width:5px;height:5px; }
.vortex span:nth-child(2){ transform: rotate(36deg) translateX(34px); opacity:0.8; }
.vortex span:nth-child(3){ transform: rotate(72deg) translateX(52px); opacity:0.95; width:5px;height:5px; }
.vortex span:nth-child(4){ transform: rotate(108deg) translateX(68px); opacity:0.7; }
.vortex span:nth-child(5){ transform: rotate(144deg) translateX(28px); opacity:0.85; }
.vortex span:nth-child(6){ transform: rotate(180deg) translateX(48px); opacity:0.9; width:4px;height:4px; }
.vortex span:nth-child(7){ transform: rotate(216deg) translateX(78px); opacity:0.75; }
.vortex span:nth-child(8){ transform: rotate(252deg) translateX(38px); opacity:0.8; width:5px;height:5px; }
.vortex span:nth-child(9){ transform: rotate(288deg) translateX(62px); opacity:0.7; }
.vortex span:nth-child(10){ transform: rotate(324deg) translateX(58px); opacity:0.9; }
.vortex2{
  position:absolute;inset:-30%;
  transform: scale(2.1);
  animation: vortexRotate 26s linear infinite reverse;
  opacity:0.7;
}
.vortex2 span{
  position:absolute;left:50%;top:50%;
  width:1.5px;height:1.5px;background:#ffd6c2;border-radius:50%;
  box-shadow: 0 0 4px rgba(255,214,194,0.8);
  transform-origin: 0 0;
}
.vortex2 span:nth-child(1){ transform: rotate(15deg) translateX(16px); }
.vortex2 span:nth-child(2){ transform: rotate(85deg) translateX(44px); }
.vortex2 span:nth-child(3){ transform: rotate(155deg) translateX(58px); }
.vortex2 span:nth-child(4){ transform: rotate(225deg) translateX(74px); }
.vortex2 span:nth-child(5){ transform: rotate(295deg) translateX(32px); }
.vortex-core{
  transform: scale(1.6);
  width:18px;height:18px;border-radius:50%;
  background: radial-gradient(circle, #fff 0%, #ff9a6b 35%, #ff6b35 70%, transparent 100%);
  box-shadow: 0 0 10px rgba(255,107,53,0.8), 0 0 20px rgba(255,107,53,0.4), 0 0 30px rgba(255,107,53,0.2);
  position:relative;z-index:2;
  animation: corePulse 3s ease-in-out infinite;
}

.vortex span:nth-child(11){ transform: rotate(18deg) translateX(44px); opacity:0.8; width:4px;height:4px; }
.vortex span:nth-child(12){ transform: rotate(54deg) translateX(62px); opacity:0.75; }
.vortex span:nth-child(13){ transform: rotate(90deg) translateX(38px); opacity:0.9; width:5px;height:5px; }
.vortex span:nth-child(14){ transform: rotate(126deg) translateX(58px); opacity:0.7; }
.vortex span:nth-child(15){ transform: rotate(162deg) translateX(42px); opacity:0.85; }
.vortex span:nth-child(16){ transform: rotate(198deg) translateX(68px); opacity:0.8; width:4px;height:4px; }
.vortex span:nth-child(17){ transform: rotate(234deg) translateX(48px); opacity:0.75; }
.vortex span:nth-child(18){ transform: rotate(270deg) translateX(72px); opacity:0.9; }
.vortex span:nth-child(19){ transform: rotate(306deg) translateX(36px); opacity:0.8; width:5px;height:5px; }
.vortex span:nth-child(20){ transform: rotate(342deg) translateX(54px); opacity:0.7; }
.vortex span:nth-child(21){ transform: rotate(10deg) translateX(88px); opacity:0.6; width:3px;height:3px; }
.vortex span:nth-child(22){ transform: rotate(100deg) translateX(92px); opacity:0.65; }
.vortex span:nth-child(23){ transform: rotate(190deg) translateX(86px); opacity:0.6; width:3px;height:3px; }
.vortex span:nth-child(24){ transform: rotate(280deg) translateX(90px); opacity:0.55; }
.vortex span:nth-child(25){ transform: rotate(45deg) translateX(28px); opacity:0.7; width:3px;height:3px; }
.vortex2 span:nth-child(6){ transform: rotate(40deg) translateX(52px); opacity:0.7; }
.vortex2 span:nth-child(7){ transform: rotate(120deg) translateX(68px); opacity:0.65; }
.vortex2 span:nth-child(8){ transform: rotate(200deg) translateX(54px); opacity:0.7; }
.vortex2 span:nth-child(9){ transform: rotate(280deg) translateX(62px); opacity:0.6; }
.vortex2 span:nth-child(10){ transform: rotate(340deg) translateX(48px); opacity:0.75; }
.vortex2 span:nth-child(11){ transform: rotate(70deg) translateX(82px); opacity:0.5; }
.vortex2 span:nth-child(12){ transform: rotate(250deg) translateX(86px); opacity:0.55; }

@keyframes vortexRotate{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
@keyframes corePulse{ 0%,100%{ transform: scale(1); opacity:0.9; } 50%{ transform: scale(1.15); opacity:1; } }
.welcome h2{color:var(--text);margin-bottom:10px;font-weight:700;font-size:1.5rem}
.welcome p{font-size:0.95rem;max-width:380px;margin:0 auto 16px;line-height:1.6}
.welcome a{color:var(--accent);text-decoration:none;font-weight:500}
#messages::-webkit-scrollbar{width:5px}#messages::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:10px}

.scroll-top-btn{
  position:absolute;
  top:-40px;
  right:6px;
  width:30px;height:30px;
  border-radius:50%;
  background:var(--surface-solid);
  border:1px solid var(--border);
  color:var(--text);
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:26;
  transition:all 0.2s cubic-bezier(0.16,1,0.3,1);
  font-size:0.85rem;
  backdrop-filter:blur(12px);
  line-height:1;
  padding:0;
}
.scroll-top-btn:hover{transform:translateY(-1px) scale(1.08);border-color:var(--border-strong);background:var(--surface-2)}
.scroll-top-btn:active{transform:translateY(0) scale(0.94)}
.scroll-top-btn[hidden]{display:none !important;opacity:0;pointer-events:none}
main{position:relative}
.input-area{position:relative}




.file-preview{margin-top:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:0.82rem}
.file-preview[hidden]{display:none}
.file-preview-thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0}
.file-preview-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-preview-remove{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px}
.file-menu{position:absolute;bottom:calc(100% + 10px);right:0;width:200px;background:var(--surface-solid);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:30}
.file-menu[hidden]{display:none}
.file-menu-item{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:0.85rem;cursor:pointer;border:none;width:100%;background:transparent;color:var(--text);text-align:left;font-family:inherit}
.file-menu-item:hover{background:var(--surface-2)}
.modal-body{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.modal-body label{font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase}
.modal-body input[type="text"],.modal-body textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-family:inherit;font-size:0.9rem;outline:none}
.modal-body textarea{min-height:140px;resize:vertical;line-height:1.5}
.modal-body input:focus,.modal-body textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.2)}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
@media (max-width:680px){
  main{padding:0 10px;min-height:0}.message{max-width:95%}#userInput{font-size:16px}
  .input-area{padding:10px 0 max(10px, env(safe-area-inset-bottom)) !important;background:#0a0a0a !important;margin:0 !important}
  .icon-btn,#sendBtn{width:44px;height:44px}
  .copy-btn{opacity:1}
  .agent-overlay,.history-overlay,.modal-overlay,.model-overlay,.key-overlay{padding-top:84px}
  .combined-frame .frame-label{font-size:0.75rem}
  header{position:sticky;top:0;flex-shrink:0}
  #messages{flex:1;min-height:0}
}

.burger-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);display:flex;align-items:flex-start;justify-content:center;padding-top:96px;padding-left:16px;padding-right:16px;z-index:90}
.burger-overlay[hidden]{display:none}
.burger-panel{width:min(400px,calc(100vw - 32px));background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:messageIn 0.35s cubic-bezier(0.16,1,0.3,1)}
.burger-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:0.9rem}
.burger-close{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.burger-list{display:flex;flex-direction:column;padding:8px}
.burger-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;border:none;background:transparent;color:var(--text);font-size:0.9rem;font-weight:500;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background 0.2s}
.burger-item:hover{background:var(--surface-2)}
.burger-icon{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}


/* --- Vortex selector overlay --- */
.vortex-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);display:flex;align-items:flex-start;justify-content:center;padding-top:96px;z-index:84;padding-left:16px;padding-right:16px}
.vortex-overlay[hidden]{display:none}
.vortex-panel{width:min(520px,calc(100vw - 32px));background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:messageIn 0.35s cubic-bezier(0.16,1,0.3,1);max-height:min(78vh,680px)}
.vortex-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:0.9rem}
.vortex-close{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vortex-list{display:flex;flex-direction:column;gap:8px;padding:12px;overflow-y:auto}
.vortex-footer{border-top:1px solid var(--border);padding:10px 14px;text-align:center}
.vortex-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:all 0.2s;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.vortex-item:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.vortex-item.active{border-color:#3b82f6;background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(59,130,246,0.15))}
.vortex-preview{width:48px;height:48px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vortex-preview-core{width:12px;height:12px;border-radius:50%;position:relative;z-index:2}
.vortex-item-html,body{background:#0a0a0a !important;background-color:#0a0a0a !important;margin:0 !important;padding:0 !important;overscroll-behavior:none !important} body{flex:1;min-width:0}
.vortex-item-title{font-weight:600;font-size:0.9rem}
.vortex-item-desc{font-size:0.73rem;color:var(--text-muted);margin-top:2px;line-height:1.3}

/* --- 25 Vortex themes espace/planètes --- */
.welcome-icon{transition:all 0.5s ease}
.welcome-icon .vortex span, .welcome-icon .vortex2 span, .welcome-icon .vortex-core{transition:all 0.5s ease}

/* 1 - Défaut Orange Feu */
.welcome-icon.vortex-default .vortex-core{background: radial-gradient(circle, #fff 0%, #ff9a6b 35%, #ff6b35 70%, transparent 100%);box-shadow: 0 0 10px rgba(255,107,53,0.8), 0 0 20px rgba(255,107,53,0.4), 0 0 30px rgba(255,107,53,0.2)}
.welcome-icon.vortex-default .vortex span{background:white;box-shadow:0 0 6px rgba(255,255,255,0.9), 0 0 12px rgba(255,107,53,0.6)}
.welcome-icon.vortex-default .vortex2 span{background:#ffd6c2}

/* 2 - Nébuleuse Bleue */
.welcome-icon.vortex-nebula .vortex-core{background: radial-gradient(circle, #fff 0%, #93c5fd 30%, #3b82f6 70%, transparent 100%);box-shadow:0 0 12px rgba(59,130,246,0.9),0 0 24px rgba(59,130,246,0.5)}
.welcome-icon.vortex-nebula .vortex span{background:#bfdbfe;box-shadow:0 0 6px #fff,0 0 12px #3b82f6}
.welcome-icon.vortex-nebula .vortex2 span{background:#60a5fa}

/* 3 - Aurore Boréale */
.welcome-icon.vortex-aurora .vortex-core{background: radial-gradient(circle, #fff 0%, #6ee7b7 30%, #10b981 70%, transparent 100%);box-shadow:0 0 12px rgba(16,185,129,0.9),0 0 24px rgba(16,185,129,0.5)}
.welcome-icon.vortex-aurora .vortex span{background:#a7f3d0;box-shadow:0 0 6px #fff,0 0 12px #10b981}
.welcome-icon.vortex-aurora .vortex2 span{background:#34d399}

/* 4 - Galaxie Violette */
.welcome-icon.vortex-galaxy .vortex-core{background: radial-gradient(circle, #fff 0%, #c4b5fd 30%, #8b5cf6 70%, transparent 100%);box-shadow:0 0 12px rgba(139,92,246,0.9),0 0 24px rgba(139,92,246,0.5)}
.welcome-icon.vortex-galaxy .vortex span{background:#ddd6fe;box-shadow:0 0 6px #fff,0 0 12px #8b5cf6}
.welcome-icon.vortex-galaxy .vortex2 span{background:#a78bfa}

/* 5 - Soleil Rouge */
.welcome-icon.vortex-sun .vortex-core{background: radial-gradient(circle, #fff 0%, #fca5a5 30%, #ef4444 70%, transparent 100%);box-shadow:0 0 12px rgba(239,68,68,0.9),0 0 24px rgba(239,68,68,0.5)}
.welcome-icon.vortex-sun .vortex span{background:#fecaca;box-shadow:0 0 6px #fff,0 0 12px #ef4444}
.welcome-icon.vortex-sun .vortex2 span{background:#f87171}

/* 6 - Océan Cyan */
.welcome-icon.vortex-ocean .vortex-core{background: radial-gradient(circle, #fff 0%, #67e8f9 30%, #06b6d4 70%, transparent 100%);box-shadow:0 0 12px rgba(6,182,214,0.9),0 0 24px rgba(6,182,214,0.5)}
.welcome-icon.vortex-ocean .vortex span{background:#a5f3fc;box-shadow:0 0 6px #fff,0 0 12px #06b6d4}
.welcome-icon.vortex-ocean .vortex2 span{background:#22d3ee}

/* 7 - Rose Néon */
.welcome-icon.vortex-pink .vortex-core{background: radial-gradient(circle, #fff 0%, #f9a8d4 30%, #ec4899 70%, transparent 100%);box-shadow:0 0 12px rgba(236,72,153,0.9),0 0 24px rgba(236,72,153,0.5)}

.welcome-icon.vortex-pink .vortex2 span{background:#f472b6}

/* 8 - Orbe Doré */
.welcome-icon.vortex-gold .vortex-core{background: radial-gradient(circle, #fff 0%, #fde68a 30%, #f59e0b 70%, transparent 100%);box-shadow:0 0 12px rgba(245,158,11,0.9),0 0 24px rgba(245,158,11,0.5)}
.welcome-icon.vortex-gold .vortex span{background:#fef3c7;box-shadow:0 0 6px #fff,0 0 12px #f59e0b}
.welcome-icon.vortex-gold .vortex2 span{background:#fbbf24}

/* 9 - Glace Blanche */
.welcome-icon.vortex-ice .vortex-core{background: radial-gradient(circle, #fff 0%, #e0f2fe 40%, #0ea5e9 80%, transparent 100%);box-shadow:0 0 12px rgba(14,165,233,0.8),0 0 24px rgba(255,255,255,0.6)}
.welcome-icon.vortex-ice .vortex span{background:#fff;box-shadow:0 0 8px #fff,0 0 14px #7dd3fc}
.welcome-icon.vortex-ice .vortex2 span{background:#e0f2fe}

/* 10 - Matrix */
.welcome-icon.vortex-matrix .vortex-core{background: radial-gradient(circle, #fff 0%, #86efac 30%, #22c55e 70%, transparent 100%);box-shadow:0 0 12px rgba(34,197,94,0.9),0 0 24px rgba(34,197,94,0.5)}
.welcome-icon.vortex-matrix .vortex span{background:#bbf7d0;box-shadow:0 0 6px #fff,0 0 12px #22c55e}
.welcome-icon.vortex-matrix .vortex2 span{background:#4ade80}

/* 11 - Mars */
.welcome-icon.vortex-mars .vortex-core{background: radial-gradient(circle, #fff 0%, #fdba74 25%, #c2410c 70%, #7c2d12 100%);box-shadow:0 0 12px rgba(194,65,12,0.9),0 0 24px rgba(124,45,18,0.5)}
.welcome-icon.vortex-mars .vortex span{background:#fed7aa;box-shadow:0 0 6px #fff,0 0 10px #c2410c}
.welcome-icon.vortex-mars .vortex2 span{background:#fb923c}

/* 12 - Jupiter */

/* --- Background selector overlay --- */
.bg-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);display:flex;align-items:flex-start;justify-content:center;padding-top:96px;z-index:84;padding-left:16px;padding-right:16px}
.bg-overlay[hidden]{display:none}
.bg-panel{width:min(560px,calc(100vw - 32px));background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:messageIn 0.35s cubic-bezier(0.16,1,0.3,1);max-height:min(80vh,720px)}
.bg-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:0.9rem}
.bg-close{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bg-list{display:flex;flex-direction:column;gap:8px;padding:12px;overflow-y:auto}
.bg-footer{border-top:1px solid var(--border);padding:10px 14px;text-align:center}
.bg-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:all 0.2s;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.bg-item:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.bg-item.active{border-color:#3b82f6;background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(59,130,246,0.15))}
.bg-preview{width:52px;height:32px;border-radius:8px;flex-shrink:0;position:relative;overflow:hidden;border:1px solid var(--border);background:var(--bg)}
.bg-item-html,body{background:#0a0a0a !important;background-color:#0a0a0a !important;margin:0 !important;padding:0 !important;overscroll-behavior:none !important} body{flex:1;min-width:0}
.bg-item-title{font-weight:600;font-size:0.88rem}
.bg-item-desc{font-size:0.72rem;color:var(--text-muted);margin-top:2px;line-height:1.3}

<script>
const messagesEl=document.getElementById('messages');
// --- ScrollTop button : flèche bas-droite quand discussion dépasse le cadre ---
const scrollTopBtn = document.getElementById('scrollTopBtn');
function checkScrollTopBtn(){
  if(!messagesEl || !scrollTopBtn) return;
  const isOverflow = messagesEl.scrollHeight > messagesEl.clientHeight + 60;
  const isScrolledDown = messagesEl.scrollTop > 250;
  // Affiche seulement si contenu dépasse et on a scrollé un peu
  if(isOverflow && isScrolledDown){
    scrollTopBtn.hidden = false;
  } else {
    scrollTopBtn.hidden = true;
  }
}
if(messagesEl && scrollTopBtn){
  messagesEl.addEventListener('scroll', checkScrollTopBtn, {passive:true});
  scrollTopBtn.addEventListener('click', ()=>{
    messagesEl.scrollTo({top:0, behavior:'smooth'});
  });
  // Observer les changements de contenu
  const resizeObserver = new ResizeObserver(()=> checkScrollTopBtn());
  resizeObserver.observe(messagesEl);
  // Check initial et après ajout de messages
  const originalAddMessageRef = window.addMessage;
  // On wrappe via un MutationObserver plus simple
  const msgObserver = new MutationObserver(()=> checkScrollTopBtn());
  msgObserver.observe(messagesEl, {childList:true, subtree:true});
  window.addEventListener('resize', checkScrollTopBtn);
  // Check au chargement
  setTimeout(checkScrollTopBtn, 300);
}

  if(k){
    const masked=k.slice(0,6)+'••••••••'+k.slice(-4);

function handleFileSelected(file, isImage=false){
  if(!file) return;
  const reader=new FileReader();
  if(isImage){
    reader.onload=(ev)=>{
      attachedImageUrl=ev.target.result;
      attachedFile={name:file.name, content:\`[Image: \${file.name}]\`, size:file.size, isImage:true, dataUrl:attachedImageUrl};
      filePreview.innerHTML=\`<img src="\${attachedImageUrl}" class="file-preview-thumb" /><span class="file-preview-name">🖼️ \${file.name} (\${Math.round(file.size/1024)} Ko)</span><button type="button" class="file-preview-remove" id="removeFileBtn">✕</button>\`;
      filePreview.hidden=false;
      document.getElementById('removeFileBtn').addEventListener('click',clearAttachedFile);
      statusHint.textContent=\`Photo ajoutée : \${file.name}\`;
    };
    reader.readAsDataURL(file);
  } else {
    reader.onload=(ev)=>{
      let content=ev.target.result; if(content.length>30000) content=content.slice(0,30000)+'...[tronqué]';
      attachedFile={name:file.name, content, size:file.size, isImage:false};
      filePreview.innerHTML=\`<span class="file-preview-name">📎 \${file.name} (\${Math.round(file.size/1024)} Ko)</span><button type="button" class="file-preview-remove" id="removeFileBtn">✕</button>\`;
      filePreview.hidden=false;
      document.getElementById('removeFileBtn').addEventListener('click',clearAttachedFile);
      statusHint.textContent=\`Fichier ajouté : \${file.name}\`;
    };
    reader.readAsText(file);
  }
}

async function fetchModels(){
  if(isTestingModels) return;
  const apiKey=getApiKey();
  if(!apiKey){ modelList.innerHTML='<p class="model-empty">Entre ta clé API via 🔑 pour charger les modèles…</p>'; return; }
  isTestingModels=true;

  modelList.innerHTML='<div style="padding:12px;font-size:0.85rem;color:var(--text-muted)"><div>Test de tous les modèles avec ta clé…<br/><span style="font-size:0.75rem">Ne ferme pas cette page pendant le test</span></div><div id="modelProgress" style="margin-top:10px;font-size:0.78rem;line-height:1.5"></div></div>';
  try{
    const res=await fetch('https://api.mistral.ai/v1/models',{headers:{'Authorization':\`Bearer \${apiKey}\`}});
    if(!res.ok){ throw new Error(await res.text()); }
    const data=await res.json();
    let models=data.data||data.models||[];
    models=models.sort((a,b)=> (a.id||'').localeCompare(b.id||''));
    if(!models.length) throw new Error('Aucun modèle');
    let chatModels=models.filter(m=>!m.id.toLowerCase().includes('embed')).map(m=>({id:m.id, owned_by:m.owned_by, created:m.created}));
    const working=await filterWorkingModels(apiKey, chatModels);
    if(working.length===0){
      modelList.innerHTML='<p class="model-empty">Aucun modèle disponible avec cette clé.<br/>Vérifie ton abonnement sur console.mistral.ai</p>';
      saveCachedModels([]);
    } else {
      saveCachedModels(working);
      // Si aucun modèle enregistré ou modèle actuel plus dans la liste, prend le 1er après test
      if(working.length>0){
        const hasCurrent = working.some(m=>m.id===MODEL);
        const hasStored = localStorage.getItem(MODEL_KEY);
        if(!hasStored || !hasCurrent){
          MODEL = working[0].id;
          localStorage.setItem(MODEL_KEY, MODEL);
          updateModelBadge();
          updateModelFooter();
        }
      }
      if(working.length>0){
        MODEL = working[0].id;
        localStorage.setItem(MODEL_KEY, MODEL);
        updateModelBadge();
        updateModelFooter();
        renderModelList(working);
        setTimeout(()=>{ const ov=document.getElementById('modelOverlay'); if(ov) ov.hidden=true; }, 350);
      } else {
        renderModelList(working);
      }
    }
  }catch(e){
    const fallback=DEFAULT_MODELS.filter(id=>!id.includes('embed')).map(id=>({id}));
    const working=await filterWorkingModels(apiKey, fallback, true);
    if(working.length>0){ 
      saveCachedModels(working);
      if(working.length>0){
        const hasCurrent = working.some(m=>m.id===MODEL);
        const hasStored = localStorage.getItem(MODEL_KEY);
        if(!hasStored || !hasCurrent){
          MODEL = working[0].id;
          localStorage.setItem(MODEL_KEY, MODEL);
          updateModelBadge();
          updateModelFooter();
        }
      }
      if(working.length>0){
        MODEL = working[0].id;
        localStorage.setItem(MODEL_KEY, MODEL);
        updateModelBadge();
        updateModelFooter();
        renderModelList(working, true);
        setTimeout(()=>{ const ov=document.getElementById('modelOverlay'); if(ov) ov.hidden=true; }, 350);
      } else {
        renderModelList(working, true);
      }
    }
    else { modelList.innerHTML=\`<p class="model-empty">Erreur : \${e.message.slice(0,120)}<br/>Impossible de lister les modèles</p>\`; }
  } finally {
    isTestingModels=false;
    const rb=document.getElementById('retestModelsBtn'); if(rb){ rb.disabled=false; rb.textContent='🔄 Mise à jour'; }
    const mc=document.getElementById('modelClose'); if(mc){ mc.disabled=false; mc.style.opacity='1'; mc.style.pointerEvents='auto'; }
  }
}
async function testSingleModel(apiKey, modelId){
  if(modelId.toLowerCase().includes('embed')) return false;
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(), 3500);
    const res=await fetch('https://api.mistral.ai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':\`Bearer \${apiKey}\`},
      body:JSON.stringify({model:modelId, messages:[{role:'user', content:'hi'}], max_tokens:1, temperature:0}),
      signal:controller.signal
    });
    clearTimeout(timeout);
    return res.ok;
  }catch(err){
    return false;
  }
}

async function filterWorkingModels(apiKey, models, showProgress=false){
  const working=[];
  const progressEl=document.getElementById('modelProgress');
  const total=models.length;
  const BATCH=5;
  for(let i=0;i<models.length;i+=BATCH){
    const batch=models.slice(i, i+BATCH);
    if(progressEl){
      progressEl.innerHTML=\`⚡ Test rapide \${Math.min(i+BATCH,total)}/\${total} — \${working.length} OK<br/><span style="font-size:0.7rem;opacity:0.8">\${batch.map(b=>b.id).join(', ')}</span>\`;
    }
    const results=await Promise.all(batch.map(m=>testSingleModel(apiKey, m.id).then(ok=>({m, ok}))));
    results.forEach(r=>{ if(r.ok) working.push(r.m); });
  }
  return working;
}
function getModelDescription(id){

    'mistral-large-2411': 'Chat | 100+ langues',

    'voxtral-small-latest': 'Transcription | 15 langues',
    'voxtral-mini-latest': 'Transcription | 15 langues'
  };
  if(d[id]) return d[id];

  if(low.includes('codestral')) return 'Code | 80 langages';

  if(low.includes('large') || low.includes('medium') || low.includes('small') || low.includes('nemo')) return 'Chat | 100+ langues';

const exportAgentsBtn = document.getElementById('exportAgentsBtn');
const importAgentsBtn = document.getElementById('importAgentsBtn');

if(exportAgentsBtn){
  exportAgentsBtn.addEventListener('click', async ()=>{
    try{
      const agentsToExport = loadAgents();
      if(!agentsToExport.length){
        const sh=document.getElementById('statusHint');
        if(sh){ sh.textContent='Aucun agent à exporter'; sh.style.display='block'; setTimeout(()=>sh.style.display='none',2000); }
        return;
      }
      const jsonStr = JSON.stringify(agentsToExport, null, 2);
      const fileName = \`agents-mistral-\${new Date().toISOString().slice(0,10)}.json\`;
      const file = new File([jsonStr], fileName, { type: 'application/json' });

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file], title: 'Mes agents Mistral', text: \`\${agentsToExport.length} agent(s) IA exporté(s)\` });
          const sh=document.getElementById('statusHint');
          if(sh){ sh.textContent='✅ Agents partagés'; sh.style.display='block'; setTimeout(()=>sh.style.display='none',2500); }
          return;
        }catch(err){
          if(err && err.name==='AbortError') return;
        }
      }
      if(navigator.share){
        try{
          await navigator.share({ files: [file], title: 'Mes agents Mistral' });
          return;
        }catch(err){
          if(err && err.name==='AbortError') return;
        }
      }
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
      const sh=document.getElementById('statusHint');
      if(sh){ sh.textContent='⬇️ Fichier téléchargé (Web Share non supporté)'; sh.style.display='block'; setTimeout(()=>sh.style.display='none',3000); }
    }catch(e){
      console.error(e);
      alert('Erreur export: '+e.message);
    }
  });
}

if(importAgentsBtn && importAgentsFile){
  importAgentsBtn.addEventListener('click', ()=> importAgentsFile.click());
  importAgentsFile.addEventListener('change', (e)=>{
    const f=e.target.files && e.target.files[0];
    if(!f) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        const list = Array.isArray(data) ? data : (data.agents || []);
        if(!Array.isArray(list) || !list.length) throw new Error('Fichier vide ou invalide');
        const valid = list.filter(a=>a && typeof a.name==='string' && typeof a.instructions==='string' && a.name.trim() && a.instructions.trim());
        if(!valid.length) throw new Error('Aucun agent valide');

        const existing = loadAgents();
        let added=0; let skipped=0; let renamed=0;
        const normalizeName = (n)=> (n||'').trim();
        const normalizeInstr = (s)=> (s||'').trim();
        const nameKey = (n)=> normalizeName(n).toLowerCase();
        const existingNames = new Set(existing.map(x=> nameKey(x.name)));
        const existingMap = new Map();
        existing.forEach(x=>{
          const k=nameKey(x.name);
          const instr=normalizeInstr(x.instructions);
          if(!existingMap.has(k)) existingMap.set(k, new Set());
          existingMap.get(k).add(instr);
        });
        const getUniqueName = (base)=>{
          let baseTrim = normalizeName(base);
          if(!existingNames.has(nameKey(baseTrim))) return baseTrim;
          let i=2;
          while(true){
            const candidate = \`\${baseTrim} \${i}\`;
            if(!existingNames.has(nameKey(candidate))) return candidate;
            i++;
          }
        };
        valid.forEach(raw=>{
          let baseName = normalizeName(raw.name);
          let instr = normalizeInstr(raw.instructions);
          let k = nameKey(baseName);
          if(existingMap.has(k) && existingMap.get(k).has(instr)){ skipped++; return; }
          let finalName = baseName;
          if(existingNames.has(k)){ finalName = getUniqueName(baseName); if(finalName !== baseName) renamed++; }
          const newAgent = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,4), name: finalName, instructions: instr, emoji: raw.emoji || '💼', createdAt: Date.now() };
          existing.unshift(newAgent);
          const fk = nameKey(finalName);
          existingNames.add(fk);
          if(!existingMap.has(fk)) existingMap.set(fk, new Set());
          existingMap.get(fk).add(instr);
          if(!existingMap.has(k)) existingMap.set(k, new Set());
          added++;
        });
        saveAgents(existing);
        agents=existing;
        renderAgentList();
        updateAgentLabel();
        const sh=document.getElementById('statusHint');
        if(sh){
          let msg=\`✅ \${added} importé(s)\`;
          if(renamed) msg+=\` • \${renamed} renommé(s)\`;
          if(skipped) msg+=\` • \${skipped} doublon(s) ignoré(s)\`;
          sh.textContent=msg; sh.style.display='block'; setTimeout(()=>sh.style.display='none',3500);
        }
      }catch(err){ console.error(err); alert('Import échoué: '+err.message); }finally{ e.target.value=''; }
    };
    reader.readAsText(f);
  });
}

function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');}catch{return [];}}
function saveHistory(l){localStorage.setItem(HISTORY_KEY,JSON.stringify(l));}
function getTitle(m){const f=m.find(x=>x.role==='user');if(!f) return 'Discussion vide';const t=f.content.trim().replace(/\\s+/g,' ');return t.length>48?t.slice(0,48)+'…':t;}
function archiveCurrent(){
  if(!conversation.length) return false;
  const list=loadHistory();
  const title=getTitle(conversation);
  const newId = currentHistoryId || (Date.now().toString(36)+Math.random().toString(36).slice(2,7));
  // Cherche si même discussion déjà existante
  let idx = -1;
  if(currentHistoryId){
    idx = list.findIndex(x=>x.id===currentHistoryId);
  }
  if(idx===-1){
    // même titre + même nombre de messages = probablement même discussion
    idx = list.findIndex(x=> x.title===title && x.messages.length===conversation.length && JSON.stringify(x.messages.slice(-1))===JSON.stringify(conversation.slice(-1)));
  }
  const entry = {id:newId,title,messages:conversation.slice(),savedAt:Date.now(),agentId:activeAgentId};
  if(idx!==-1){
    // écrase
    list[idx]=entry;
    // remonte en haut
    const moved = list.splice(idx,1)[0];
    list.unshift(moved);
  } else {
    list.unshift(entry);
    currentHistoryId=newId;
  }
  if(list.length>50) list.length=50;
  saveHistory(list);
  return true;
}
function formatDate(ts){try{return new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return '';}}

    const meta=document.createElement('div');meta.className='history-item-meta';meta.textContent=(ag?ag.emoji+' '+ag.name+' · ':'')+formatDate(item.savedAt)+' · '+item.messages.length+' messages';
    body.appendChild(title);body.appendChild(meta);
    const del=document.createElement('button');del.className='history-item-delete';del.textContent='🗑';del.title='Supprimer';del.addEventListener('click',(e)=>{e.stopPropagation(); if(confirm(\`Supprimer la discussion "\${item.title}" ?\`)){ saveHistory(loadHistory().filter(x=>x.id!==item.id)); if(currentHistoryId===item.id) currentHistoryId=null; renderHistory(); } });
    div.appendChild(body);div.appendChild(del);
    div.addEventListener('click',()=>{if(conversation.length && currentHistoryId!==item.id) archiveCurrent();currentHistoryId=item.id;conversation=item.messages.slice(); if(item.agentId){activeAgentId=item.agentId; saveActiveAgentId(activeAgentId); updateAgentLabel();} messagesEl.innerHTML=''; if(!conversation.length){messagesEl.appendChild(welcome);welcome.style.display='block';} else {welcome.style.display='none'; conversation.forEach(m=>{if(m.role==='user'||m.role==='assistant') addMessage(m.role,m.content,false);});} closeHistoryPanel();});

  }
  const copyBtn=document.createElement('button');copyBtn.className='copy-btn';copyBtn.type='button';copyBtn.textContent='⧉ Copier';

    const textToCopy = bubble.innerText || bubble.textContent || content || '';

    catch{const ta=document.createElement('textarea');ta.value=textToCopy;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copyBtn.textContent='✓ Copié';copyBtn.classList.add('copied');setTimeout(()=>{copyBtn.textContent='⧉ Copier';copyBtn.classList.remove('copied');},1800);}
  });
  wrap.appendChild(bubble);wrap.appendChild(copyBtn);
  div.appendChild(wrap);
  messagesEl.appendChild(div); messagesEl.scrollTop=messagesEl.scrollHeight;
  return bubble;
}

// --- REC v69: continu + envoi auto après pause ---
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null, isLive=false, silenceTimer=null, pendingFinal='', restartTimer=null;
const liveBtnEl = document.getElementById('liveBtn');

function createRecognition(){
  if(!SpeechRecognition) return null;
  const rec = new SpeechRecognition();
  rec.lang='fr-FR';
  rec.continuous=true;
  rec.interimResults=true;
  rec.onstart=()=>{
    isLive=true;
    pendingFinal='';
    if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
    liveBtnEl.classList.add('live-active','listening');
    liveBtnEl.textContent='⏹️';
    const hint=document.getElementById('statusHint');
    hint.textContent='🔴 REC en continu - parle, envoi auto à la pause - ⏹️ pour arrêter';
    hint.style.display='block';
  };
  rec.onresult=(event)=>{
    let interim='', finals=[];
    for(let i=event.resultIndex;i<event.results.length;i++){
      const r=event.results[i];
      if(r.isFinal) finals.push(r[0].transcript.trim());
      else interim+=r[0].transcript;
    }
    if(finals.length){
      pendingFinal = (pendingFinal + ' ' + finals.join(' ')).trim();
    }
    const input=document.getElementById('userInput');
    // Ne PAS accumuler le final dans la saisie: on montre seulement interim en saisie, le final est en attente d'envoi
    if(interim){
      input.value=interim.trim();
      input.dispatchEvent(new Event('input'));
    }
    const hint=document.getElementById('statusHint');
    const preview = (pendingFinal + (interim?' | '+interim:'')).trim();
    hint.textContent = preview ? '🔴 '+preview.slice(-120) : '🔴 Écoute...';
    hint.style.display='block';
    // Reset silence timer pour envoi auto
    if(silenceTimer) clearTimeout(silenceTimer);
    silenceTimer = setTimeout(()=>{
      if(pendingFinal && isLive){
        const toSend = pendingFinal;
        pendingFinal='';
        document.getElementById('userInput').value=toSend;
        sendMessage();
      }
    }, 1100);
  };
  rec.onerror=(e)=>{
    const hint=document.getElementById('statusHint');
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      hint.textContent='❌ Micro refusé - autorise dans Réglages Safari > Micro';
      hint.style.display='block';
      stopLive();
    } else if(e.error==='no-speech'){
      // relance si toujours en live
      if(isLive){
        try{ rec.stop(); }catch{}
        restartTimer=setTimeout(()=>{ if(isLive) try{rec.start();}catch{} }, 250);
      }
    } else {
      hint.textContent='⚠️ Micro: '+e.error;
      hint.style.display='block';
    }
  };
  rec.onend=()=>{
    if(isLive){
      restartTimer=setTimeout(()=>{ if(isLive){ try{ rec.start(); }catch{} } }, 200);
    } else {
      liveBtnEl.classList.remove('live-active','listening');
      liveBtnEl.textContent='🔴';
      const hint=document.getElementById('statusHint');
      // envoie ce qui reste avant de fermer
      if(pendingFinal){
        const toSend=pendingFinal; pendingFinal='';
        document.getElementById('userInput').value=toSend;
        sendMessage();
      }
      hint.textContent='Prêt';
      hint.style.display='none';
      if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
    }
  };
  return rec;
}

recognition = createRecognition();

function stopLive(){
  isLive=false;
  if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
  if(restartTimer){ clearTimeout(restartTimer); restartTimer=null; }
  liveBtnEl.classList.remove('live-active','listening');
  liveBtnEl.textContent='🔴';
  try{ if(recognition) recognition.stop(); }catch{}
  recognition = createRecognition(); // recrée pour éviter état bloqué iOS
  const hint=document.getElementById('statusHint');
  // garde le texte restant dans la saisie si pas envoyé
  if(pendingFinal){
    document.getElementById('userInput').value=pendingFinal;
  }
  pendingFinal='';
  hint.textContent='Prêt';
  hint.style.display='none';
}

if(!SpeechRecognition){
  liveBtnEl.title='Micro non supporté';
  liveBtnEl.style.opacity='0.5';
  liveBtnEl.addEventListener('click',()=>{ alert('🎙️ Micro non supporté. Sur iPhone: Réglages > Safari > Micro ON, ou utilise le clavier 🎙️'); });
} else {
  liveBtnEl.addEventListener('click',()=>{
    if(isLive){ stopLive(); }
    else {
      try{
        if(!recognition) recognition=createRecognition();
        document.getElementById('userInput').value='';
        pendingFinal='';
        recognition.start();
      }catch(e){
        const hint=document.getElementById('statusHint');
        hint.textContent='❌ Impossible de démarrer le micro';
        hint.style.display='block';
        stopLive();
      }
    }
  });
}


async function sendMessage(){
  const rawText=userInput.value.trim(); const apiKey=getApiKey();
  if((!rawText && !attachedFile) || !apiKey){ if(!apiKey){ openKeyPanel(); return; } if(!rawText && !attachedFile) return; }
  if(isGenerating) return;
  let text=rawText; let displayText=rawText; let imgUrl=null;
  if(attachedFile){
    if(attachedFile.isImage){ text=\`[Image jointe: \${attachedFile.name}]\\n\${rawText}\`; displayText=rawText; imgUrl=attachedFile.dataUrl; }
    else { text=\`[Fichier joint: \${attachedFile.name}]\\n\${attachedFile.content}\\n\\n---\\n\${rawText}\`; displayText=\`📎 \${attachedFile.name}\\n\${rawText}\`; }
  }
  isGenerating=true; sendBtn.disabled=true; userInput.value=''; userInput.style.height='auto';
  addMessage('user',displayText,false,imgUrl); conversation.push({role:'user', content:text}); showTyping();
  clearAttachedFile();
  try{
    const activeAgent=getActiveAgent();
    let messagesToSend=[];
    if(activeAgent && activeAgent.instructions) messagesToSend.push({role:'system', content:activeAgent.instructions});
    messagesToSend=messagesToSend.concat(conversation);
    const response=await fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':\`Bearer \${apiKey}\`},body:JSON.stringify({model:MODEL,messages:messagesToSend,stream:true,temperature:0.7})});
    removeTyping();
    if(!response.ok){const err=await response.json().catch(()=>({})); addMessage('assistant',err.message||err.detail||\`Erreur \${response.status}\`,true); isGenerating=false; enableInput(); return;}
    const bubble=addMessage('assistant',''); let fullContent=''; const reader=response.body.getReader(); const decoder=new TextDecoder(); let buffer='';
    while(true){const {done,value}=await reader.read(); if(done) break; buffer+=decoder.decode(value,{stream:true}); const lines=buffer.split('\\n'); buffer=lines.pop()||''; for(const line of lines){const t=line.trim(); if(!t||!t.startsWith('data: ')) continue; const data=t.slice(6); if(data==='[DONE]') continue; try{const p=JSON.parse(data); const d=p.choices?.[0]?.delta?.content; if(d){fullContent+=d; bubble.textContent=fullContent; messagesEl.scrollTop=messagesEl.scrollHeight;}}catch{}}}
    if(fullContent) conversation.push({role:'assistant',content:fullContent}); else bubble.textContent='(Réponse vide)';
  }catch(err){removeTyping(); addMessage('assistant','Erreur réseau : '+err.message,true);}
  isGenerating=false; enableInput(); userInput.focus();
}

function applyVortexStyle(styleId){

  if(!icon) return;

// Fix plein écran mobile - force 100dvh
function setFullHeight(){
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', \`\${vh}px\`);
  // Pour iOS, ajuste body
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)){
    document.body.style.height = window.innerHeight + 'px';
  }
}
setFullHeight();
window.addEventListener('resize', setFullHeight);
window.addEventListener('orientationchange', ()=> setTimeout(setFullHeight, 200));
// Empêche le bounce iOS

// FIX bande blanche clavier iOS
(function(){
  try{
    const st=document.createElement('style');
    st.textContent='html,body,#root,main,#messages,.input-area{background:#0a0a0a !important;background-color:#0a0a0a !important} .input-area{backdrop-filter:none !important; -webkit-backdrop-filter:none !important}';
    document.addEventListener('DOMContentLoaded',()=>{document.head.appendChild(st);});
    if(document.head) document.head.appendChild(st);
  }catch(e){}
  // Empêche le bounce qui révèle le fond blanc
  if(window.visualViewport){
    visualViewport.addEventListener('resize',()=>{
      document.documentElement.style.height=visualViewport.height+'px';
      document.body.style.background='#0a0a0a';
    });
  }
})();

document.addEventListener('touchmove', function(e){
  if(e.target.closest('#messages')) return;
  // allow scroll only in messages
}, {passive:false});
