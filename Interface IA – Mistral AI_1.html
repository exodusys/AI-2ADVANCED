<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interface IA – Mistral AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="dark"] {
      --bg: #0b0b0f;
      --bg-gradient: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255, 107, 53, 0.12), transparent),
                     radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99, 102, 241, 0.08), transparent);
      --surface: rgba(22, 22, 28, 0.85);
      --surface-solid: #16161c;
      --surface-2: #1e1e26;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: #f0f0f5;
      --text-muted: #8b8b9a;
      --accent: #ff6b35;
      --accent-hover: #ff8255;
      --accent-glow: rgba(255, 107, 53, 0.25);
      --user-bg: linear-gradient(135deg, #2a1f1a 0%, #2e221c 100%);
      --user-border: rgba(255, 107, 53, 0.2);
      --assistant-bg: #1a1a22;
      --assistant-border: rgba(255, 255, 255, 0.06);
      --error: #f87171;
      --error-bg: rgba(248, 113, 113, 0.1);
      --error-text: #fca5a5;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.25);
      --scrollbar: rgba(255, 255, 255, 0.1);
      --header-blur: blur(20px) saturate(1.4);
    }
    [data-theme="light"] {
      --bg: #f4f4f8;
      --bg-gradient: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255, 107, 53, 0.08), transparent),
                     radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99, 102, 241, 0.05), transparent);
      --surface: rgba(255, 255, 255, 0.8);
      --surface-solid: #ffffff;
      --surface-2: #f0f0f5;
      --border: rgba(0, 0, 0, 0.06);
      --border-strong: rgba(0, 0, 0, 0.1);
      --text: #1a1a22;
      --text-muted: #6b6b7a;
      --accent: #e85d04;
      --accent-hover: #f48c06;
      --accent-glow: rgba(232, 93, 4, 0.15);
      --user-bg: linear-gradient(135deg, #fff5ee 0%, #ffeee3 100%);
      --user-border: rgba(232, 93, 4, 0.15);
      --assistant-bg: #ffffff;
      --assistant-border: rgba(0, 0, 0, 0.06);
      --error: #dc2626;
      --error-bg: rgba(220, 38, 38, 0.06);
      --error-text: #b91c1c;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
      --scrollbar: rgba(0, 0, 0, 0.12);
      --header-blur: blur(20px) saturate(1.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--surface);
      backdrop-filter: var(--header-blur);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      z-index: 20;
    }
    .controls { display: flex; align-items: flex-end; gap: 12px; flex: 1; flex-wrap: wrap; justify-content: flex-end; }
    .api-row { display: flex; align-items: center; gap: 8px; }
    .api-field { flex: 1; min-width: 200px; max-width: 420px; }
    input[type="password"] {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      padding: 9px 14px; border-radius: var(--radius-sm); font-size: 0.875rem; font-family: inherit;
      min-width: 190px; outline: none; flex: 1;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .btn {
      background: var(--accent); color: white; border: none; padding: 9px 18px;
      border-radius: var(--radius-sm); font-weight: 600; font-size: 0.875rem; font-family: inherit;
      cursor: pointer; transition: background 0.2s, transform 0.12s; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.96); }
    .btn.secondary { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
    .btn.secondary:hover { background: var(--border-strong); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #themeToggle, #historyBtn {
      width: 42px; height: 42px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center; font-size: 1.15rem; padding: 0;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text); cursor: pointer;
    }
    .history-wrap { position: relative; }
    .history-panel {
      position: absolute; top: calc(100% + 8px); right: 0;
      width: min(340px, calc(100vw - 24px)); max-height: min(420px, 70vh);
      background: var(--surface-solid); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow); display: flex; flex-direction: column; z-index: 50; overflow: hidden;
    }
    .history-panel[hidden] { display: none; }
    .history-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .history-close { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 6px; }
    .history-list { overflow-y: auto; flex: 1; padding: 8px; }
    .history-empty { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 24px 12px; }
    .history-item { display: flex; gap: 8px; padding: 10px; border-radius: 10px; cursor: pointer; }
    .history-item:hover { background: var(--surface-2); }
    .history-item-body { flex: 1; min-width: 0; }
    .history-item-title { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item-meta { font-size: 0.72rem; color: var(--text-muted); }
    .history-item-delete { background: transparent; border: none; color: var(--text-muted); cursor: pointer; }
    .history-footer { border-top: 1px solid var(--border); padding: 8px 12px; text-align: center; }
    .btn-danger-text { background: transparent; border: none; color: var(--error); font-size: 0.8rem; cursor: pointer; }

    main { flex: 1; display: flex; flex-direction: column; max-width: 820px; width: 100%; margin: 0 auto; padding: 0 20px; overflow: hidden; }
    #messages { flex: 1; overflow-y: auto; padding: 28px 4px 16px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    .message { display: flex; gap: 12px; max-width: 82%; animation: messageIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes messageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; box-shadow: var(--shadow-sm); }
    .message.user .avatar { background: linear-gradient(145deg, #ff6b35, #f7931e); color: white; }
    .message.assistant .avatar { background: linear-gradient(145deg, #6366f1, #8b5cf6); color: white; }
    .bubble-wrap { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
    .bubble { padding: 14px 18px; border-radius: var(--radius); line-height: 1.6; font-size: 0.935rem; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow-sm); }
    .message.user .bubble { background: var(--user-bg); border: 1px solid var(--user-border); border-bottom-right-radius: 4px; }
    .message.assistant .bubble { background: var(--assistant-bg); border: 1px solid var(--assistant-border); border-bottom-left-radius: 4px; }
    .message.error .bubble { background: var(--error-bg); border: 1px solid var(--error); color: var(--error-text); }

    /* bouton copier */
    .copy-btn {
      align-self: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s, color 0.2s;
      font-family: inherit;
    }
    .message:hover .copy-btn, .copy-btn:focus { opacity: 1; }
    .copy-btn:hover { background: var(--border-strong); color: var(--text); }
    .copy-btn.copied { color: #22c55e; border-color: rgba(34,197,94,0.3); }
    .message.user .copy-btn { align-self: flex-end; }

    .typing { display: flex; gap: 5px; padding: 6px 2px; }
    .typing span { width: 7px; height: 7px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.3s ease-in-out infinite; }
    .typing span:nth-child(2){ animation-delay: 0.15s; } .typing span:nth-child(3){ animation-delay: 0.3s; }
    @keyframes bounce { 0%,60%,100%{ transform: translateY(0); opacity:0.35; } 30%{ transform: translateY(-6px); opacity:1; } }

    .input-area { padding: 12px 0 28px; }
    .input-wrapper {
      display: flex; gap: 8px; background: var(--surface); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 18px; padding: 8px;
      align-items: flex-end; box-shadow: var(--shadow); transition: border-color 0.25s, box-shadow 0.25s;
    }
    .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow); }
    #userInput {
      flex: 1; background: transparent; border: none; color: var(--text); font-size: 0.95rem;
      padding: 12px 14px; resize: none; max-height: 160px; outline: none; font-family: inherit; line-height: 1.5;
    }
    #userInput::placeholder { color: var(--text-muted); opacity: 0.7; }
    #sendBtn {
      width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      padding: 0; font-size: 1.15rem; flex-shrink: 0;
    }
    .icon-btn {
      width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      padding: 0; font-size: 1.2rem; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; transition: all 0.2s;
    }
    .icon-btn:hover { background: var(--border-strong); border-color: var(--border-strong); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 2px 12px var(--accent-glow); }
    .icon-btn.listening { background: rgba(239,68,68,0.15); border-color: #ef4444; color: #ef4444; animation: pulse-mic 1.4s infinite; }
    .icon-btn.tts-active { background: rgba(34,197,94,0.15); border-color: #22c55e; color: #22c55e; }
    @keyframes pulse-mic { 0%{ box-shadow: 0 0 0 0 rgba(239,68,68,0.45);} 70%{ box-shadow: 0 0 0 10px rgba(239,68,68,0);} 100%{ box-shadow: 0 0 0 0 rgba(239,68,68,0);} }
    .live-active { background: linear-gradient(135deg, #ef4444, #f97316) !important; color: white !important; border-color: #ef4444 !important; }

    .hint { text-align: center; font-size: 0.72rem; color: var(--text-muted); margin-top: 12px; opacity: 0.8; }
    .welcome { text-align: center; padding: 80px 24px 40px; color: var(--text-muted); }
    .welcome-icon { width: 64px; height: 64px; margin: 0 auto 20px; background: linear-gradient(145deg, #ff6b35, #f7931e); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; }
    .welcome h2 { color: var(--text); margin-bottom: 10px; font-weight: 700; font-size: 1.5rem; }
    .welcome p { font-size: 0.95rem; max-width: 380px; margin: 0 auto 16px; line-height: 1.6; }
    .welcome a { color: var(--accent); text-decoration: none; font-weight: 500; }

    #messages::-webkit-scrollbar { width: 5px; } #messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 10px; }
    @media (max-width: 680px){
      main{ padding: 0 10px; } .message{ max-width: 95%; } #userInput{ font-size:16px; }
      .input-area{ padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      .icon-btn, #sendBtn{ width: 44px; height: 44px; }
      .copy-btn{ opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="controls">
      <div class="field api-field">
        <div class="api-row">
          <input type="password" id="apiKey" placeholder="Clé API Mistral…" autocomplete="off" />
          <button id="themeToggle" title="Changer de thème">🌙</button>
        </div>
      </div>
      <button class="btn secondary" id="clearBtn" title="Archiver puis effacer">Effacer</button>
      <div class="history-wrap">
        <button class="btn secondary" id="historyBtn" title="Discussions">☰</button>
        <div class="history-panel" id="historyPanel" hidden>
          <div class="history-header"><span>Discussions</span><button type="button" id="historyClose" class="history-close">✕</button></div>
          <div class="history-list" id="historyList"><p class="history-empty">Aucune discussion enregistrée</p></div>
          <div class="history-footer"><button type="button" id="clearAllHistory" class="btn-danger-text">Tout supprimer</button></div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✨</div>
        <h2>Bienvenue</h2>
        <p>Entrez votre clé API Mistral, puis commencez à discuter en direct.</p>
        <p style="font-size:0.8rem; opacity:0.75;">Clé gratuite sur <a href="https://console.mistral.ai/" target="_blank">console.mistral.ai</a></p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <!-- Discussion en direct (remplace le micro) -->
        <button type="button" id="liveBtn" class="icon-btn" title="Discussion en direct avec l'IA - micro continu" aria-label="Discussion en direct">
          💬
        </button>
        <!-- Haut-parleur TTS à gauche du bouton envoyer mais on le met à gauche du champ pour respecter demande -->
        <button type="button" id="ttsBtn" class="icon-btn" title="Lecture vocale des réponses" aria-label="Activer la voix">
          🔊
        </button>
        <textarea id="userInput" rows="1" placeholder="Écrivez ou dictez" disabled></textarea>
        <button class="btn" id="sendBtn" disabled title="Envoyer">➤</button>
      </div>
      <p class="hint" id="statusHint">Votre clé API reste dans le navigateur · Ne l'utilisez pas sur un appareil partagé</p>
    </div>
  </main>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const messagesEl = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const liveBtn = document.getElementById('liveBtn');
    const ttsBtn = document.getElementById('ttsBtn');
    const clearBtn = document.getElementById('clearBtn');
    const welcome = document.getElementById('welcome');
    const themeToggle = document.getElementById('themeToggle');
    const statusHint = document.getElementById('statusHint');
    const html = document.documentElement;

    const MODEL = 'open-mistral-nemo';
    const DEFAULT_HINT = 'Votre clé API reste dans le navigateur · Ne l’utilisez pas sur un appareil partagé';
    const HISTORY_KEY = 'mistral_chat_history';

    let conversation = [];
    let isGenerating = false;

    // ===== Thème =====
    function applyTheme(theme){
      html.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('mistral_theme', theme);
    }
    const savedTheme = localStorage.getItem('mistral_theme');
    if(savedTheme) applyTheme(savedTheme);
    else if(window.matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light');
    else applyTheme('dark');
    themeToggle.addEventListener('click', ()=>{
      applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
    });

    // ===== Clé API =====
    const savedKey = localStorage.getItem('mistral_api_key');
    if(savedKey){ apiKeyInput.value = savedKey; enableInput(); }
    apiKeyInput.addEventListener('change', ()=>{
      const k = apiKeyInput.value.trim();
      if(k){ localStorage.setItem('mistral_api_key', k); enableInput(); }
      else { localStorage.removeItem('mistral_api_key'); disableInput(); }
    });
    apiKeyInput.addEventListener('input', ()=>{
      if(apiKeyInput.value.trim()) enableInput(); else disableInput();
    });
    function enableInput(){ userInput.disabled=false; sendBtn.disabled=false; liveBtn.disabled=false; }
    function disableInput(){ userInput.disabled=true; sendBtn.disabled=true; liveBtn.disabled=true; stopLive(); }

    userInput.addEventListener('input', ()=>{
      userInput.style.height='auto';
      userInput.style.height=Math.min(userInput.scrollHeight,160)+'px';
    });
    userInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
    });
    sendBtn.addEventListener('click', sendMessage);
    clearBtn.addEventListener('click', clearConversation);

    // ===== Historique =====
    const historyBtn = document.getElementById('historyBtn');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');
    const historyClose = document.getElementById('historyClose');
    const clearAllHistoryBtn = document.getElementById('clearAllHistory');
    function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }catch{ return []; } }
    function saveHistory(list){ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
    function getTitle(msgs){ const f=msgs.find(m=>m.role==='user'); if(!f) return 'Discussion vide'; const t=f.content.trim().replace(/\s+/g,' '); return t.length>48?t.slice(0,48)+'…':t; }
    function archiveCurrent(){ if(!conversation.length) return false; const list=loadHistory(); list.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), title:getTitle(conversation), messages:conversation.slice(), savedAt:Date.now()}); if(list.length>50) list.length=50; saveHistory(list); return true; }
    function formatDate(ts){ try{ return new Date(ts).toLocaleString('fr-FR',{day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});}catch{return '';} }
    function renderHistory(){
      const list=loadHistory();
      if(!list.length){ historyList.innerHTML='<p class="history-empty">Aucune discussion enregistrée</p>'; return; }
      historyList.innerHTML='';
      list.forEach(item=>{
        const div=document.createElement('div'); div.className='history-item';
        const body=document.createElement('div'); body.className='history-item-body';
        const title=document.createElement('div'); title.className='history-item-title'; title.textContent=item.title;
        const meta=document.createElement('div'); meta.className='history-item-meta'; meta.textContent=formatDate(item.savedAt)+' · '+item.messages.length+' messages';
        body.appendChild(title); body.appendChild(meta);
        const del=document.createElement('button'); del.className='history-item-delete'; del.textContent='🗑'; del.addEventListener('click',(e)=>{e.stopPropagation(); saveHistory(loadHistory().filter(x=>x.id!==item.id)); renderHistory();});
        div.appendChild(body); div.appendChild(del);
        div.addEventListener('click',()=>{ if(conversation.length) archiveCurrent(); conversation=item.messages.slice(); messagesEl.innerHTML=''; if(!conversation.length){messagesEl.appendChild(welcome); welcome.style.display='block';} else {welcome.style.display='none'; conversation.forEach(m=>{ if(m.role==='user'||m.role==='assistant') addMessage(m.role,m.content,false,false);});} closePanel(); });
        historyList.appendChild(div);
      });
    }
    function closePanel(){ historyPanel.hidden=true; }
    function openPanel(){ renderHistory(); historyPanel.hidden=false; }
    historyBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(historyPanel.hidden) openPanel(); else closePanel(); });
    historyClose.addEventListener('click', closePanel);
    clearAllHistoryBtn.addEventListener('click',()=>{ if(confirm('Supprimer toutes les discussions ?')){ saveHistory([]); renderHistory(); }});
    document.addEventListener('click',(e)=>{ if(!historyPanel.hidden && !historyPanel.contains(e.target) && e.target!==historyBtn) closePanel(); });
    function clearConversation(){ archiveCurrent(); conversation=[]; messagesEl.innerHTML=''; messagesEl.appendChild(welcome); welcome.style.display='block'; renderHistory(); stopSpeech(); }

    // ===== COPIE + MESSAGE =====
    function addMessage(role, content, isError=false, shouldSpeak=false){
      welcome.style.display='none';
      const div=document.createElement('div');
      div.className=`message ${role}`+(isError?' error':'');
      const avatar=document.createElement('div'); avatar.className='avatar'; avatar.textContent=role==='user'?'👤':(isError?'⚠️':'✨');
      const wrap=document.createElement('div'); wrap.className='bubble-wrap';
      const bubble=document.createElement('div'); bubble.className='bubble'; bubble.textContent=content;
      const copyBtn=document.createElement('button'); copyBtn.className='copy-btn'; copyBtn.type='button'; copyBtn.textContent='⧉ Copier';
      copyBtn.addEventListener('click', async ()=>{
        try{
          await navigator.clipboard.writeText(content);
          copyBtn.textContent='✓ Copié'; copyBtn.classList.add('copied');
          setTimeout(()=>{ copyBtn.textContent='⧉ Copier'; copyBtn.classList.remove('copied'); },1500);
        }catch{
          // fallback
          const ta=document.createElement('textarea'); ta.value=content; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
          copyBtn.textContent='✓ Copié'; setTimeout(()=>copyBtn.textContent='⧉ Copier',1500);
        }
      });
      wrap.appendChild(bubble); wrap.appendChild(copyBtn);
      div.appendChild(avatar); div.appendChild(wrap);
      messagesEl.appendChild(div);
      messagesEl.scrollTop=messagesEl.scrollHeight;
      return bubble;
    }

    function showTyping(){
      const div=document.createElement('div'); div.className='message assistant'; div.id='typing';
      const avatar=document.createElement('div'); avatar.className='avatar'; avatar.textContent='✨';
      const wrap=document.createElement('div'); wrap.className='bubble-wrap';
      const bubble=document.createElement('div'); bubble.className='bubble'; bubble.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
      wrap.appendChild(bubble); div.appendChild(avatar); div.appendChild(wrap);
      messagesEl.appendChild(div); messagesEl.scrollTop=messagesEl.scrollHeight;
    }
    function removeTyping(){ const el=document.getElementById('typing'); if(el) el.remove(); }

    // ===== TTS VOIX =====
    let ttsEnabled = localStorage.getItem('mistral_tts_enabled')==='true';
    let frenchVoice = null;
    function loadVoices(){
      const voices = speechSynthesis.getVoices();
      // Cherche voix FR naturelle
      frenchVoice = voices.find(v=>v.lang.startsWith('fr') && v.name.includes('Google')) ||
                    voices.find(v=>v.lang==='fr-FR') ||
                    voices.find(v=>v.lang.startsWith('fr')) ||
                    null;
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
    function updateTTSBtn(){
      if(ttsEnabled){ ttsBtn.classList.add('tts-active'); ttsBtn.textContent='🔊'; ttsBtn.title='Voix activée - lecture auto des réponses'; }
      else { ttsBtn.classList.remove('tts-active'); ttsBtn.textContent='🔈'; ttsBtn.title='Voix désactivée'; }
    }
    updateTTSBtn();
    ttsBtn.addEventListener('click', ()=>{
      ttsEnabled = !ttsEnabled;
      localStorage.setItem('mistral_tts_enabled', ttsEnabled);
      updateTTSBtn();
      if(!ttsEnabled) stopSpeech();
      else if(conversation.length){
        const last = [...conversation].reverse().find(m=>m.role==='assistant');
        if(last) speak(last.content);
      }
    });
    function stopSpeech(){ try{ speechSynthesis.cancel(); }catch{} }
    function speak(text){
      if(!ttsEnabled || !text) return;
      stopSpeech();
      // Nettoie un peu le texte pour la voix
      const clean = text.replace(/```[\s\S]*?```/g,' code ').replace(/[#*_`]/g,'').trim().slice(0,4000);
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang='fr-FR';
      utter.rate=1.05;
      utter.pitch=1.0;
      if(frenchVoice) utter.voice=frenchVoice;
      speechSynthesis.speak(utter);
    }

    // ===== DISCUSSION EN DIRECT (remplace micro) =====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isLive = false;
    let voiceBuffer = '';
    let silenceTimer = null;
    let autoSendPending = false;
    let restartAfterResponse = false;

    if(SpeechRecognition){
      recognition = new SpeechRecognition();
      recognition.lang='fr-FR';
      recognition.continuous=true;
      recognition.interimResults=true;
      recognition.maxAlternatives=1;

      recognition.onstart = ()=>{
        isLive=true;
        liveBtn.classList.add('live-active','listening');
        liveBtn.textContent='🔴';
        liveBtn.title='Discussion en direct active - cliquez pour arrêter';
        statusHint.textContent='🎙️ Discussion en direct... Parlez, je vous écoute en continu';
        voiceBuffer='';
      };
      recognition.onresult = (event)=>{
        let interim='';
        let finalChunk='';
        for(let i=event.resultIndex; i<event.results.length; i++){
          const res=event.results[i];
          if(res.isFinal) finalChunk+=res[0].transcript+' ';
          else interim+=res[0].transcript;
        }
        voiceBuffer = (voiceBuffer + ' ' + finalChunk).replace(/\s+/g,' ').trim();
        if(finalChunk) voiceBuffer = finalChunk.trim() + ' ' + voiceBuffer;
        // On garde le dernier final + interim pour preview
        const allFinals = [];
        for(let i=0;i<event.results.length;i++){ if(event.results[i].isFinal) allFinals.push(event.results[i][0].transcript); }
        const preview = (allFinals.join(' ')+' '+interim).trim();
        if(preview){
          userInput.value=preview;
          userInput.dispatchEvent(new Event('input'));
          statusHint.textContent='🎙️ '+preview.slice(0,80)+(preview.length>80?'...':'');
        }
        if(silenceTimer) clearTimeout(silenceTimer);
        if(preview){
          silenceTimer=setTimeout(()=>{
            if(!isLive) return;
            autoSendPending=true;
            recognition.stop(); // déclenchera onend avec envoi auto
          },1300);
        }
      };
      recognition.onerror = (e)=>{
        if(e.error==='aborted' || e.error==='no-speech'){
          if(isLive && autoSendPending) return; // géré dans onend
        }
        if(e.error==='not-allowed'){
          statusHint.textContent='Micro refusé. Autorisez dans le navigateur.';
          stopLive();
        }
      };
      recognition.onend = ()=>{
        if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
        const textToSend = (userInput.value || voiceBuffer || '').trim();
        const doAuto = autoSendPending && textToSend && isLive;
        // Si on est toujours en mode live, on doit relancer après envoi
        const wasLive = isLive;
        // Reset UI temporairement, mais on va redémarrer si live
        if(!doAuto){
          // arrêt sans texte -> si live demandé, on relance
          if(wasLive && !autoSendPending){
            // petite pause puis restart pour garder micro continu
            setTimeout(()=>{ if(isLive) try{ recognition.start(); }catch{} }, 300);
            return;
          }
        }
        if(doAuto){
          userInput.value=textToSend;
          statusHint.textContent='Envoi...';
          autoSendPending=false;
          voiceBuffer='';
          sendMessage().then(()=>{
            if(isLive){
              // Après réponse IA, relance l'écoute automatiquement
              setTimeout(()=>{ if(isLive) try{ recognition.start(); }catch{} }, 700);
            }
          });
        } else {
          if(wasLive){
            liveBtn.classList.remove('live-active','listening');
            liveBtn.textContent='💬';
            isLive=false;
            statusHint.textContent=DEFAULT_HINT;
          }
        }
        voiceBuffer='';
        autoSendPending=false;
      };
    } else {
      liveBtn.title='Reconnaissance vocale non supportée (utilisez Chrome/Edge)';
      liveBtn.disabled=true;
    }

    function stopLive(){
      isLive=false;
      autoSendPending=false;
      if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
      liveBtn.classList.remove('live-active','listening');
      liveBtn.textContent='💬';
      liveBtn.title='Discussion en direct avec l\'IA - micro continu';
      try{ if(recognition) recognition.stop(); }catch{}
      statusHint.textContent=DEFAULT_HINT;
      voiceBuffer='';
    }
    liveBtn.addEventListener('click', ()=>{
      if(!recognition) return;
      if(isLive){
        stopLive();
      } else {
        try{
          stopSpeech();
          voiceBuffer='';
          autoSendPending=false;
          userInput.value='';
          recognition.start();
        }catch(e){ stopLive(); }
      }
    });

    // ===== ENVOI =====
    async function sendMessage(){
      const text=userInput.value.trim();
      const apiKey=apiKeyInput.value.trim();
      if(!text || !apiKey || isGenerating) return;
      isGenerating=true;
      sendBtn.disabled=true;
      userInput.value=''; userInput.style.height='auto';
      stopSpeech();
      addMessage('user', text);
      conversation.push({role:'user', content:text});
      showTyping();
      try{
        const response=await fetch('https://api.mistral.ai/v1/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
          body:JSON.stringify({model:MODEL, messages:conversation, stream:true, temperature:0.7})
        });
        removeTyping();
        if(!response.ok){
          const err=await response.json().catch(()=>({}));
          const msg=err.message||err.detail||`Erreur ${response.status}`;
          addMessage('assistant', msg, true);
          isGenerating=false; sendBtn.disabled=false; return;
        }
        const bubble=addMessage('assistant','');
        let fullContent='';
        const reader=response.body.getReader();
        const decoder=new TextDecoder();
        let buffer='';
        while(true){
          const {done, value}=await reader.read();
          if(done) break;
          buffer+=decoder.decode(value,{stream:true});
          const lines=buffer.split('\n'); buffer=lines.pop()||'';
          for(const line of lines){
            const t=line.trim(); if(!t || !t.startsWith('data: ')) continue;
            const data=t.slice(6); if(data==='[DONE]') continue;
            try{
              const parsed=JSON.parse(data);
              const delta=parsed.choices?.[0]?.delta?.content;
              if(delta){ fullContent+=delta; bubble.textContent=fullContent; messagesEl.scrollTop=messagesEl.scrollHeight; }
            }catch{}
          }
        }
        if(fullContent){
          conversation.push({role:'assistant', content:fullContent});
          if(ttsEnabled) speak(fullContent);
        } else bubble.textContent='(Réponse vide)';
      }catch(err){
        removeTyping();
        addMessage('assistant','Erreur réseau : '+err.message,true);
      }
      isGenerating=false; sendBtn.disabled=false; userInput.focus();
    }
  </script>
