<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mistral – Chat IA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --bg:#0b0b0f; --bg-gradient: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,107,53,0.12), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99,102,241,0.08), transparent);
  --surface: rgba(22,22,28,0.85); --surface-solid:#16161c; --surface-2:#1e1e26;
  --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
  --text:#f0f0f5; --text-muted:#8b8b9a; --accent:#ff6b35; --accent-hover:#ff8255; --accent-glow: rgba(255,107,53,0.25);
  --agent-bg: linear-gradient(135deg,#2563eb,#3b82f6); --agent-glow: rgba(37,99,235,0.3);
  --user-bg: linear-gradient(135deg,#2a1f1a 0%,#2e221c 100%); --user-border: rgba(255,107,53,0.2);
  --assistant-bg:#1a1a22; --assistant-border: rgba(255,255,255,0.06);
  --error:#f87171; --error-bg: rgba(248,113,113,0.1); --error-text:#fca5a5;
  --radius:16px; --radius-sm:10px; --shadow:0 8px 32px rgba(0,0,0,0.4); --shadow-sm:0 2px 12px rgba(0,0,0,0.25); --scrollbar: rgba(255,255,255,0.1);
}
[data-theme="light"] {
  --bg:#f4f4f8; --bg-gradient: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,107,53,0.08), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99,102,241,0.05), transparent);
  --surface: rgba(255,255,255,0.8); --surface-solid:#ffffff; --surface-2:#f0f0f5;
  --border: rgba(0,0,0,0.06); --border-strong: rgba(0,0,0,0.1);
  --text:#1a1a22; --text-muted:#6b6b7a; --accent:#e85d04; --accent-hover:#f48c06; --accent-glow: rgba(232,93,4,0.15);
  --agent-bg: linear-gradient(135deg,#2563eb,#3b82f6); --agent-glow: rgba(37,99,235,0.2);
  --user-bg: linear-gradient(135deg,#fff5ee 0%,#ffeee3 100%); --user-border: rgba(232,93,4,0.15);
  --assistant-bg:#ffffff; --assistant-border: rgba(0,0,0,0.06);
  --error:#dc2626; --error-bg: rgba(220,38,38,0.06); --error-text:#b91c1c;
  --shadow:0 8px 32px rgba(0,0,0,0.06); --shadow-sm:0 2px 12px rgba(0,0,0,0.04); --scrollbar: rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);background-image:var(--bg-gradient);background-attachment:fixed;color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:10px;z-index:20}
.header-top{display:flex;align-items:center;gap:10px;width:100%}
.header-top input{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:var(--radius-sm);width:100%;font-size:0.875rem;font-family:inherit;outline:none;min-width:0}
.header-top input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.header-bottom{display:flex;align-items:center;gap:8px;width:100%}
#clearBtn{flex:1;width:100%;padding:11px 14px;font-size:0.875rem}
.btn{background:var(--accent);color:white;border:none;padding:9px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:0.875rem;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn.secondary{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.btn:disabled{opacity:0.45;cursor:not-allowed}
/* Même design pour les 3 icônes : création agent, choix agent, 3 traits */
#themeToggle,#historyBtn,#agentCreateBtn,#agentListBtn{
  width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.15rem;padding:0;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);cursor:pointer;flex-shrink:0;transition:all 0.2s;
}
#themeToggle:hover,#historyBtn:hover,#agentCreateBtn:hover,#agentListBtn:hover{background:var(--border-strong)}
#themeToggle:disabled,#historyBtn:disabled,#agentCreateBtn:disabled,#agentListBtn:disabled{opacity:0.45;cursor:not-allowed}

/* 3 pages centrées, alignées en haut légèrement plus bas que la page du tchat */
.agent-overlay,.history-overlay,.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:96px; /* légèrement plus bas que le tchat */
  z-index:80;padding-left:16px;padding-right:16px;
}
.agent-overlay[hidden],.history-overlay[hidden],.modal-overlay[hidden]{display:none}
.history-overlay{z-index:81}
.modal-overlay{z-index:100}
.agent-panel-centered,.history-panel,.modal{
  width:min(420px,calc(100vw - 32px));max-height:min(70vh,560px);
  background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;animation:messageIn 0.35s cubic-bezier(0.16,1,0.3,1);
}
.modal{width:min(560px,calc(100vw - 32px));max-height:80vh}
.agent-panel-header,.history-header,.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:0.95rem}
.modal-header h3{display:flex;align-items:center;gap:8px}
.agent-close,.history-close,.modal-close{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:8px}
.agent-close:hover,.history-close:hover,.modal-close:hover{background:var(--surface-2)}
.agent-list,.history-list{overflow-y:auto;flex:1;padding:10px}
.agent-empty,.history-empty{text-align:center;color:var(--text-muted);font-size:0.85rem;padding:32px 12px;line-height:1.5}
.agent-item,.history-item{display:flex;gap:10px;padding:12px;border-radius:12px;cursor:pointer;align-items:center;border:1px solid transparent;transition:all 0.15s}
.agent-item:hover,.history-item:hover{background:var(--surface-2);border-color:var(--border)}
.agent-item.active{background:linear-gradient(135deg,rgba(37,99,235,0.12),rgba(59,130,246,0.12));border-color:#3b82f6}
.agent-item-body,.history-item-body{flex:1;min-width:0}
.agent-item-title,.history-item-title{font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.agent-item-meta,.history-item-meta{font-size:0.73rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.agent-delete,.agent-edit,.history-item-delete{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:0.95rem;padding:6px 8px;border-radius:8px;transition:all 0.15s}
.agent-delete:hover,.history-item-delete:hover{background:var(--error-bg);color:var(--error)}
.agent-edit:hover{background:var(--surface-2);color:var(--text)}
.agent-footer,.history-footer{border-top:1px solid var(--border);padding:12px 14px;text-align:center}
.btn-danger-text{background:transparent;border:none;color:var(--error);font-size:0.8rem;cursor:pointer}

main{flex:1;display:flex;flex-direction:column;max-width:820px;width:100%;margin:0 auto;padding:0 20px;overflow:hidden}
#messages{flex:1;overflow-y:auto;padding:28px 4px 16px;display:flex;flex-direction:column;gap:20px}
.message{display:flex;gap:12px;max-width:82%;animation:messageIn 0.35s ease}
@keyframes messageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.message.user .avatar{background:linear-gradient(145deg,#ff6b35,#f7931e);color:white}
.message.assistant .avatar{background:var(--agent-bg);color:white}
.bubble-wrap{display:flex;flex-direction:column;gap:6px;max-width:100%}
.bubble{padding:14px 18px;border-radius:var(--radius);line-height:1.6;font-size:0.935rem;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-sm)}
.message.user .bubble{background:var(--user-bg);border:1px solid var(--user-border);border-bottom-right-radius:4px}
.message.assistant .bubble{background:var(--assistant-bg);border:1px solid var(--assistant-border);border-bottom-left-radius:4px}
.message.error .bubble{background:var(--error-bg);border:1px solid var(--error);color:var(--error-text)}
.copy-btn{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:0.75rem;padding:4px 8px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity 0.2s;font-family:inherit}
.message:hover .copy-btn{opacity:1}
.copy-btn:hover{background:var(--border-strong);color:var(--text)}
.copy-btn.copied{color:#22c55e;border-color:rgba(34,197,94,0.3)}
.message.user .copy-btn{align-self:flex-end}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing span{width:7px;height:7px;background:var(--text-muted);border-radius:50%;animation:bounce 1.3s infinite}
.typing span:nth-child(2){animation-delay:0.15s}.typing span:nth-child(3){animation-delay:0.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.35}30%{transform:translateY(-6px);opacity:1}}

.input-area{padding:12px 0 85px}
.input-wrapper{display:flex;gap:8px;background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:18px;padding:8px;align-items:flex-end;box-shadow:var(--shadow);margin-bottom:12px}
.input-wrapper:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),var(--shadow)}
#userInput{flex:1;background:transparent;border:none;color:var(--text);font-size:0.95rem;padding:12px 14px;resize:none;max-height:160px;outline:none;font-family:inherit;line-height:1.5}
#userInput::placeholder{color:var(--text-muted);opacity:0.7}
#sendBtn{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.15rem;flex-shrink:0}
#sendBtn:disabled{opacity:0.45}
.icon-btn{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.2rem;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all 0.2s}
.icon-btn:disabled{opacity:0.45;cursor:not-allowed}
.icon-btn:not(:disabled):hover{background:var(--border-strong)}
.icon-btn.listening{background:rgba(239,68,68,0.15);border-color:#ef4444;color:#ef4444;animation:pulse-mic 1.4s infinite}
.live-active{background:linear-gradient(135deg,#ef4444,#f97316) !important;color:white !important;border-color:#ef4444 !important}
@keyframes pulse-mic{0%{box-shadow:0 0 0 0 rgba(239,68,68,0.45)}70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.hint{text-align:center;font-size:0.72rem;color:var(--text-muted);margin-top:12px;opacity:0.8}
.hint b{color:var(--accent)}
.welcome{text-align:center;padding:80px 24px 40px;color:var(--text-muted)}
.welcome-icon{width:64px;height:64px;background:linear-gradient(145deg,#ff6b35,#f7931e);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;flex-shrink:0}
.welcome h2{color:var(--text);margin-bottom:10px;font-weight:700;font-size:1.5rem}
.welcome p{font-size:0.95rem;max-width:380px;margin:0 auto 16px;line-height:1.6}
.welcome a{color:var(--accent);text-decoration:none;font-weight:500}
#messages::-webkit-scrollbar{width:5px}#messages::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:10px}
.file-preview{margin-top:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:0.82rem}
.file-preview[hidden]{display:none}
.file-preview-thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface-2)}
.file-preview-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-preview-remove{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px}
.file-preview-remove:hover{background:var(--error-bg);color:var(--error)}
.file-menu{position:absolute;bottom:calc(100% + 10px);right:0;width:200px;background:var(--surface-solid);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:30}
.file-menu[hidden]{display:none}
.file-menu-item{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:0.85rem;cursor:pointer;transition:background 0.15s;border:none;width:100%;background:transparent;color:var(--text);text-align:left;font-family:inherit}
.file-menu-item:hover{background:var(--surface-2)}
.file-menu-item span.icon{font-size:1.1rem;width:20px;text-align:center}
.modal-body{padding:20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.modal-body label{font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase}
.modal-body input[type="text"],.modal-body textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-family:inherit;font-size:0.9rem;outline:none}
.modal-body textarea{min-height:140px;resize:vertical;line-height:1.5}
.modal-body input:focus,.modal-body textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 3px var(--agent-glow)}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
@media (max-width:680px){
  main{padding:0 10px}.message{max-width:95%}#userInput{font-size:16px}
  .input-area{padding:12px 0 90px;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .icon-btn,#sendBtn{width:44px;height:44px}
  .copy-btn{opacity:1}
}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <input type="password" id="apiKey" placeholder="Clé API Mistral…" autocomplete="off" />
    <button id="themeToggle" title="Changer de thème">🌙</button>
  </div>
  <div class="header-bottom">
    <button class="btn secondary" id="clearBtn">Effacer</button>
    <button id="agentCreateBtn" title="Créer un agent IA">💼</button>
    <button id="agentListBtn" title="Mes agents IA">👤</button>
    <button class="btn secondary" id="historyBtn" title="Discussions">☰</button>
  </div>
</header>

<div class="history-overlay" id="historyOverlay" hidden>
  <div class="history-panel" id="historyPanel">
    <div class="history-header"><span>Discussions sauvegardées</span><button type="button" id="historyClose" class="history-close">✕</button></div>
    <div class="history-list" id="historyList"><p class="history-empty">Aucune discussion enregistrée</p></div>
    <div class="history-footer"><button type="button" id="clearAllHistory" class="btn-danger-text">Tout supprimer</button></div>
  </div>
</div>

<div class="agent-overlay" id="agentOverlay" hidden>
  <div class="agent-panel-centered">
    <div class="agent-panel-header"><span>💼 Mes agents IA</span><button type="button" id="agentPanelClose" class="agent-close">✕</button></div>
    <div class="agent-list" id="agentList"></div>
    <div class="agent-footer"><button type="button" id="clearActiveAgent" class="btn secondary" style="width:100%">Sans agent</button></div>
  </div>
</div>

<main>
  <div id="messages">
    <div class="welcome" id="welcome">
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px">
        <div class="welcome-icon">✨</div>
      </div>
      <h2>Bienvenue</h2>
      <p>Crée un agent IA pour personnaliser les réponses.</p>
      <p style="font-size:0.8rem;opacity:0.75">Clé sur <a href="https://console.mistral.ai/" target="_blank">console.mistral.ai</a></p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrapper" style="position:relative">
      <button type="button" id="liveBtn" class="icon-btn" title="Discussion en direct">💬</button>
      <textarea id="userInput" rows="1" placeholder="Écrivez ou dictez"></textarea>
      <div style="position:relative">
        <button type="button" id="fileBtn" class="icon-btn" title="Ajouter fichier / photo">📎</button>
        <div class="file-menu" id="fileMenu" hidden>
          <button type="button" class="file-menu-item" data-action="file"><span class="icon">📄</span> Choisir un fichier</button>
          <button type="button" class="file-menu-item" data-action="photo"><span class="icon">🖼️</span> Choisir une photo</button>
          <button type="button" class="file-menu-item" data-action="camera"><span class="icon">📷</span> Prendre une photo</button>
        </div>
      </div>
      <input type="file" id="fileInput" hidden accept=".txt,.md,.js,.py,.json,.csv,.html,.css,.pdf,.docx,.xlsx" />
      <input type="file" id="photoInput" hidden accept="image/*" />
      <input type="file" id="cameraInput" hidden accept="image/*" capture="environment" />
      <button class="btn" id="sendBtn" title="Envoyer">➤</button>
    </div>
    <div id="filePreview" class="file-preview" hidden></div>
    <p class="hint" id="statusHint">Entre ta clé API Mistral en haut pour commencer</p>
  </div>
</main>

<div class="modal-overlay" id="agentModal" hidden>
  <div class="modal">
    <div class="modal-header"><h3 id="agentModalTitle"><span>💼</span> Créer un agent IA</h3><button type="button" id="agentModalClose" class="modal-close">✕</button></div>
    <div class="modal-body">
      <div><label for="agentName">Nom de l'agent</label><input type="text" id="agentName" placeholder="Ex: Coach, Prof de français..." /></div>
      <div><label for="agentInstructions">Instructions - Type de réponse que l'IA doit donner</label><textarea id="agentInstructions" placeholder="Ex: Tu es un coach sportif motivant..."></textarea></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn secondary" id="agentCancel">Annuler</button><button type="button" class="btn" id="agentSave" style="background:var(--agent-bg);color:white">Enregistrer</button></div>
  </div>
</div>

<script>
const apiKeyInput=document.getElementById('apiKey');
const messagesEl=document.getElementById('messages');
const userInput=document.getElementById('userInput');
const sendBtn=document.getElementById('sendBtn');
const liveBtn=document.getElementById('liveBtn');
const clearBtn=document.getElementById('clearBtn');
const welcome=document.getElementById('welcome');
const themeToggle=document.getElementById('themeToggle');
const statusHint=document.getElementById('statusHint');
const html=document.documentElement;
const MODEL='open-mistral-nemo';
const DEFAULT_HINT='Entre ta clé API Mistral en haut pour commencer';
const HISTORY_KEY='mistral_chat_history';
const AGENTS_KEY='mistral_agents';
const ACTIVE_AGENT_KEY='mistral_active_agent';
const FIXED_EMOJI='💼';
let conversation=[], isGenerating=false, agents=[], activeAgentId=null, editingAgentId=null, attachedFile=null, attachedImageUrl=null;

function applyTheme(t){html.setAttribute('data-theme',t);themeToggle.textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('mistral_theme',t);}
const savedTheme=localStorage.getItem('mistral_theme');
if(savedTheme) applyTheme(savedTheme); else if(window.matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light'); else applyTheme('dark');
themeToggle.addEventListener('click',()=>applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark'));

function enableInput(){
  userInput.disabled=false;
  liveBtn.disabled=false;
  const fb=document.getElementById('fileBtn');
  if(fb) fb.disabled=false;
  const hasKey=apiKeyInput.value.trim().length>0;
  sendBtn.disabled = !hasKey || isGenerating;
}
function disableInput(){
  userInput.disabled=false;
  liveBtn.disabled=false;
  const fb=document.getElementById('fileBtn');
  if(fb) fb.disabled=false;
  sendBtn.disabled=true;
  if(typeof stopLive==='function'){ try{stopLive();}catch{} }
}
const savedKey=localStorage.getItem('mistral_api_key');
if(savedKey){apiKeyInput.value=savedKey; enableInput();}
else { userInput.disabled=false; liveBtn.disabled=false; document.getElementById('fileBtn').disabled=false; sendBtn.disabled=true; }

apiKeyInput.addEventListener('change',()=>{const k=apiKeyInput.value.trim(); if(k){localStorage.setItem('mistral_api_key',k);enableInput();}else{localStorage.removeItem('mistral_api_key');disableInput();}});
apiKeyInput.addEventListener('input',()=>{const k=apiKeyInput.value.trim(); if(k){localStorage.setItem('mistral_api_key',k); enableInput();} else {localStorage.removeItem('mistral_api_key'); disableInput();}});

userInput.addEventListener('input',()=>{userInput.style.height='auto';userInput.style.height=Math.min(userInput.scrollHeight,160)+'px';});
userInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
sendBtn.addEventListener('click',sendMessage);
clearBtn.addEventListener('click',clearConversation);

const fileBtn=document.getElementById('fileBtn');
const fileMenu=document.getElementById('fileMenu');
const fileInput=document.getElementById('fileInput');
const photoInput=document.getElementById('photoInput');
const cameraInput=document.getElementById('cameraInput');
const filePreview=document.getElementById('filePreview');
fileBtn.addEventListener('click',(e)=>{e.stopPropagation(); fileMenu.hidden=!fileMenu.hidden;});
fileMenu.addEventListener('click',(e)=>{
  const item=e.target.closest('.file-menu-item');
  if(!item) return;
  const action=item.dataset.action;
  fileMenu.hidden=true;
  if(action==='file') fileInput.click();
  else if(action==='photo') photoInput.click();
  else if(action==='camera') cameraInput.click();
});
function handleFileSelected(file, isImage=false){
  if(!file) return;
  const reader = new FileReader();
  if(isImage){
    reader.onload = (ev)=>{
      attachedImageUrl = ev.target.result;
      attachedFile = {name:file.name, content:`[Image: ${file.name}]`, size:file.size, isImage:true, dataUrl:attachedImageUrl};
      filePreview.innerHTML=`<img src="${attachedImageUrl}" class="file-preview-thumb" /><span class="file-preview-name">🖼️ ${file.name} (${Math.round(file.size/1024)} Ko)</span><button type="button" class="file-preview-remove" id="removeFileBtn">✕</button>`;
      filePreview.hidden=false;
      document.getElementById('removeFileBtn').addEventListener('click',clearAttachedFile);
      statusHint.textContent=`Photo ajoutée : ${file.name}`;
    };
    reader.readAsDataURL(file);
  } else {
    reader.onload = (ev)=>{
      let content = ev.target.result;
      if(content.length>30000) content=content.slice(0,30000)+'...[tronqué]';
      attachedFile={name:file.name, content, size:file.size, isImage:false};
      filePreview.innerHTML=`<span class="file-preview-name">📎 ${file.name} (${Math.round(file.size/1024)} Ko)</span><button type="button" class="file-preview-remove" id="removeFileBtn">✕</button>`;
      filePreview.hidden=false;
      document.getElementById('removeFileBtn').addEventListener('click',clearAttachedFile);
      statusHint.textContent=`Fichier ajouté : ${file.name}`;
    };
    reader.readAsText(file);
  }
}
fileInput.addEventListener('change', (e)=>{ const f=e.target.files[0]; if(f) handleFileSelected(f,false); });
photoInput.addEventListener('change', (e)=>{ const f=e.target.files[0]; if(f) handleFileSelected(f,true); });
cameraInput.addEventListener('change', (e)=>{ const f=e.target.files[0]; if(f) handleFileSelected(f,true); });
function clearAttachedFile(){ attachedFile=null; attachedImageUrl=null; fileInput.value=''; photoInput.value=''; cameraInput.value=''; filePreview.hidden=true; updateAgentHint();}

function loadAgents(){try{return JSON.parse(localStorage.getItem(AGENTS_KEY)||'[]');}catch{return [];}}
function saveAgents(l){localStorage.setItem(AGENTS_KEY,JSON.stringify(l));}
function loadActiveAgentId(){return localStorage.getItem(ACTIVE_AGENT_KEY);}
function saveActiveAgentId(id){if(id) localStorage.setItem(ACTIVE_AGENT_KEY,id); else localStorage.removeItem(ACTIVE_AGENT_KEY);}
agents=loadAgents(); activeAgentId=loadActiveAgentId();
function getActiveAgent(){return agents.find(a=>a.id===activeAgentId)||null;}
function updateAgentHint(){
  if(attachedFile) return;
  const ag=getActiveAgent();
  if(ag) statusHint.innerHTML=`Agent actif : <b>${ag.emoji} ${ag.name}</b> — ${ag.instructions.slice(0,60)}...`;
  else statusHint.textContent=DEFAULT_HINT;
}
updateAgentHint();

function openAgentModal(editAgent=null){
  editingAgentId=editAgent?editAgent.id:null;
  if(editAgent){agentModalTitle.innerHTML='<span>💼</span> Modifier l\'agent'; agentNameInput.value=editAgent.name; agentInstructionsInput.value=editAgent.instructions;}
  else {agentModalTitle.innerHTML='<span>💼</span> Créer un agent IA'; agentNameInput.value=''; agentInstructionsInput.value='';}
  agentModal.hidden=false; setTimeout(()=>agentNameInput.focus(),100);
}
function closeAgentModal(){agentModal.hidden=true; editingAgentId=null;}
agentCreateBtn.addEventListener('click',()=>openAgentModal(null));
agentModalClose.addEventListener('click',closeAgentModal);
agentCancel.addEventListener('click',closeAgentModal);
agentModal.addEventListener('click',(e)=>{if(e.target===agentModal) closeAgentModal();});
agentSave.addEventListener('click',()=>{
  const name=agentNameInput.value.trim(); const instr=agentInstructionsInput.value.trim();
  if(!name){alert('Donne un nom'); return;} if(!instr){alert('Donne des instructions'); return;}
  if(editingAgentId){const idx=agents.findIndex(a=>a.id===editingAgentId); if(idx!==-1){agents[idx].name=name; agents[idx].instructions=instr; agents[idx].emoji=FIXED_EMOJI;}}
  else {agents.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), name, instructions:instr, emoji:FIXED_EMOJI, createdAt:Date.now()});}
  saveAgents(agents); if(!editingAgentId){activeAgentId=agents[0].id; saveActiveAgentId(activeAgentId);} updateAgentHint(); renderAgentList(); closeAgentModal();
});
function renderAgentList(){
  if(!agents.length){agentList.innerHTML='<p class="agent-empty">Aucun agent<br/>Clique sur 💼 pour créer ton premier agent</p>'; return;}
  agentList.innerHTML='';
  agents.forEach(agent=>{
    const div=document.createElement('div'); div.className='agent-item'+(agent.id===activeAgentId?' active':'');
    const body=document.createElement('div'); body.className='agent-item-body';
    const title=document.createElement('div'); title.className='agent-item-title'; title.textContent=agent.emoji+' '+agent.name;
    const meta=document.createElement('div'); meta.className='agent-item-meta'; meta.textContent=agent.instructions;
    body.appendChild(title); body.appendChild(meta);
    const edit=document.createElement('button'); edit.className='agent-edit'; edit.textContent='✏️'; edit.title='Modifier'; edit.addEventListener('click',(e)=>{e.stopPropagation(); openAgentModal(agent);});
    const del=document.createElement('button'); del.className='agent-delete'; del.textContent='🗑'; del.title='Supprimer'; del.addEventListener('click',(e)=>{e.stopPropagation(); if(confirm(`Supprimer "${agent.name}" ?`)){agents=agents.filter(a=>a.id!==agent.id); if(activeAgentId===agent.id){activeAgentId=null; saveActiveAgentId(null);} saveAgents(agents); updateAgentHint(); renderAgentList();}});
    div.appendChild(body); div.appendChild(edit); div.appendChild(del);
    div.addEventListener('click',()=>{activeAgentId=agent.id; saveActiveAgentId(activeAgentId); updateAgentHint(); renderAgentList(); agentOverlay.hidden=true;});
    agentList.appendChild(div);
  });
}
function openAgentPanel(){renderAgentList(); agentOverlay.hidden=false; closeHistoryPanel();}
function closeAgentPanel(){agentOverlay.hidden=true;}
agentListBtn.addEventListener('click',(e)=>{e.stopPropagation(); if(agentOverlay.hidden) openAgentPanel(); else closeAgentPanel();});
agentPanelClose.addEventListener('click',closeAgentPanel);
clearActiveAgentBtn.addEventListener('click',()=>{activeAgentId=null; saveActiveAgentId(null); updateAgentHint(); renderAgentList(); closeAgentPanel();});

const historyBtn=document.getElementById('historyBtn');
const historyOverlay=document.getElementById('historyOverlay');
const historyList=document.getElementById('historyList');
const historyClose=document.getElementById('historyClose');
const clearAllHistoryBtn=document.getElementById('clearAllHistory');
function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');}catch{return [];}}
function saveHistory(l){localStorage.setItem(HISTORY_KEY,JSON.stringify(l));}
function getTitle(m){const f=m.find(x=>x.role==='user');if(!f) return 'Discussion vide';const t=f.content.trim().replace(/\s+/g,' ');return t.length>48?t.slice(0,48)+'…':t;}
function archiveCurrent(){if(!conversation.length) return false;const list=loadHistory();list.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:getTitle(conversation),messages:conversation.slice(),savedAt:Date.now(),agentId:activeAgentId});if(list.length>50) list.length=50;saveHistory(list);return true;}
function formatDate(ts){try{return new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return '';}}
function renderHistory(){
  const list=loadHistory();
  if(!list.length){historyList.innerHTML='<p class="history-empty">Aucune discussion enregistrée</p>';return;}
  historyList.innerHTML='';
  list.forEach(item=>{
    const div=document.createElement('div');div.className='history-item';
    const body=document.createElement('div');body.className='history-item-body';
    const title=document.createElement('div');title.className='history-item-title';title.textContent=item.title;
    const ag=agents.find(a=>a.id===item.agentId);
    const meta=document.createElement('div');meta.className='history-item-meta';meta.textContent=(ag?ag.emoji+' '+ag.name+' · ':'')+formatDate(item.savedAt)+' · '+item.messages.length+' messages';
    body.appendChild(title);body.appendChild(meta);
    const del=document.createElement('button');del.className='history-item-delete';del.textContent='🗑';del.addEventListener('click',(e)=>{e.stopPropagation();saveHistory(loadHistory().filter(x=>x.id!==item.id));renderHistory();});
    div.appendChild(body);div.appendChild(del);
    div.addEventListener('click',()=>{if(conversation.length) archiveCurrent();conversation=item.messages.slice(); if(item.agentId){activeAgentId=item.agentId; saveActiveAgentId(activeAgentId); updateAgentHint();} messagesEl.innerHTML=''; if(!conversation.length){messagesEl.appendChild(welcome);welcome.style.display='block';} else {welcome.style.display='none'; conversation.forEach(m=>{if(m.role==='user'||m.role==='assistant') addMessage(m.role,m.content,false);});} closeHistoryPanel();});
    historyList.appendChild(div);
  });
}
function closeHistoryPanel(){historyOverlay.hidden=true;}
function openHistoryPanel(){renderHistory();historyOverlay.hidden=false; closeAgentPanel(); closeAgentModal();}
historyBtn.addEventListener('click',(e)=>{e.stopPropagation(); if(historyOverlay.hidden) openHistoryPanel(); else closeHistoryPanel();});
historyClose.addEventListener('click',closeHistoryPanel);
historyOverlay.addEventListener('click',(e)=>{if(e.target===historyOverlay) closeHistoryPanel();});
clearAllHistoryBtn.addEventListener('click',()=>{if(confirm('Supprimer toutes les discussions ?')){saveHistory([]);renderHistory();}});
document.addEventListener('click',(e)=>{
  if(!fileMenu.hidden && !fileMenu.contains(e.target) && e.target!==fileBtn) fileMenu.hidden=true;
});
function clearConversation(){archiveCurrent();conversation=[];messagesEl.innerHTML='';messagesEl.appendChild(welcome);welcome.style.display='block';renderHistory(); clearAttachedFile();}

function addMessage(role,content,isError=false, imageUrl=null){
  welcome.style.display='none';
  const div=document.createElement('div');div.className=`message ${role}`+(isError?' error':'');
  const avatar=document.createElement('div');avatar.className='avatar';
  const ag=getActiveAgent();
  avatar.textContent=role==='user'?'👤':(isError?'⚠️':(ag?ag.emoji:'✨'));
  const wrap=document.createElement('div');wrap.className='bubble-wrap';
  const bubble=document.createElement('div');bubble.className='bubble';
  if(imageUrl){
    const img=document.createElement('img'); img.src=imageUrl; img.style.maxWidth='100%'; img.style.borderRadius='10px'; img.style.marginBottom='8px'; img.style.display='block';
    bubble.appendChild(img);
    const txt=document.createElement('div'); txt.textContent=content; bubble.appendChild(txt);
  } else {
    bubble.textContent=content;
  }
  const copyBtn=document.createElement('button');copyBtn.className='copy-btn';copyBtn.type='button';copyBtn.textContent='⧉ Copier';
  copyBtn.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(content);copyBtn.textContent='✓ Copié';copyBtn.classList.add('copied');setTimeout(()=>{copyBtn.textContent='⧉ Copier';copyBtn.classList.remove('copied');},1500);}
    catch{const ta=document.createElement('textarea');ta.value=content;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();copyBtn.textContent='✓ Copié';setTimeout(()=>copyBtn.textContent='⧉ Copier',1500);}
  });
  wrap.appendChild(bubble);wrap.appendChild(copyBtn);
  div.appendChild(avatar);div.appendChild(wrap);
  messagesEl.appendChild(div); messagesEl.scrollTop=messagesEl.scrollHeight;
  return bubble;
}
function showTyping(){
  const div=document.createElement('div');div.className='message assistant';div.id='typing';
  const avatar=document.createElement('div');avatar.className='avatar'; const ag=getActiveAgent(); avatar.textContent=ag?ag.emoji:'✨';
  const wrap=document.createElement('div');wrap.className='bubble-wrap';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(bubble);div.appendChild(avatar);div.appendChild(wrap);
  messagesEl.appendChild(div);messagesEl.scrollTop=messagesEl.scrollHeight;
}
function removeTyping(){const el=document.getElementById('typing'); if(el) el.remove();}
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null, isLive=false, silenceTimer=null, autoSendPending=false;
if(SpeechRecognition){
  recognition=new SpeechRecognition(); recognition.lang='fr-FR'; recognition.continuous=true; recognition.interimResults=true;
  recognition.onstart=()=>{isLive=true; liveBtn.classList.add('live-active','listening'); liveBtn.textContent='🔴'; statusHint.textContent='🎙️ Discussion en direct...';};
  recognition.onresult=(event)=>{
    let interim='', finals=[];
    for(let i=event.resultIndex;i<event.results.length;i++){const r=event.results[i]; if(r.isFinal) finals.push(r[0].transcript); else interim+=r[0].transcript;}
    const preview=(finals.join(' ')+' '+interim).trim();
    if(preview){userInput.value=preview; userInput.dispatchEvent(new Event('input')); statusHint.textContent='🎙️ '+preview.slice(0,80);}
    if(silenceTimer) clearTimeout(silenceTimer);
    if(preview){silenceTimer=setTimeout(()=>{if(!isLive) return; autoSendPending=true; recognition.stop();},1300);}
  };
  recognition.onerror=(e)=>{if(e.error==='not-allowed'){statusHint.textContent='Micro refusé.'; stopLive();}};
  recognition.onend=()=>{
    if(silenceTimer){clearTimeout(silenceTimer);silenceTimer=null;}
    const textToSend=(userInput.value||'').trim(); const wasLive=isLive; const doAuto=autoSendPending && textToSend && wasLive;
    if(!doAuto){ if(wasLive && !autoSendPending){setTimeout(()=>{if(isLive) try{recognition.start();}catch{}},300); return;}}
    if(doAuto){autoSendPending=false; sendMessage().then(()=>{if(isLive) setTimeout(()=>{try{recognition.start();}catch{}},700);});}
    else {if(wasLive){liveBtn.classList.remove('live-active','listening'); liveBtn.textContent='💬'; isLive=false; updateAgentHint();}}
    autoSendPending=false;
  };
}else{liveBtn.title='Non supporté'; liveBtn.disabled=true;}
function stopLive(){isLive=false; autoSendPending=false; if(silenceTimer){clearTimeout(silenceTimer);silenceTimer=null;} liveBtn.classList.remove('live-active','listening'); liveBtn.textContent='💬'; try{if(recognition) recognition.stop();}catch{} updateAgentHint();}
liveBtn.addEventListener('click',()=>{if(!recognition) return; if(isLive) stopLive(); else {try{autoSendPending=false; userInput.value=''; recognition.start();}catch(e){stopLive();}}});
async function sendMessage(){
  const rawText=userInput.value.trim(); const apiKey=apiKeyInput.value.trim();
  if((!rawText && !attachedFile) || !apiKey){ if(!apiKey){ statusHint.textContent='⚠️ Entre ta clé API Mistral en haut'; apiKeyInput.focus(); return; } if(!rawText && !attachedFile) return; }
  if(isGenerating) return;
  let text=rawText; let displayText=rawText; let imgUrl=null;
  if(attachedFile){
    if(attachedFile.isImage){ text=`[Image jointe: ${attachedFile.name}]\n${rawText}`; displayText=rawText; imgUrl=attachedFile.dataUrl; }
    else { text=`[Fichier joint: ${attachedFile.name}]\n${attachedFile.content}\n\n---\n${rawText}`; displayText=`📎 ${attachedFile.name}\n${rawText}`; }
  }
  isGenerating=true; sendBtn.disabled=true; userInput.value=''; userInput.style.height='auto';
  addMessage('user',displayText,false,imgUrl); conversation.push({role:'user', content:text}); showTyping();
  clearAttachedFile();
  try{
    const activeAgent=getActiveAgent();
    let messagesToSend=[];
    if(activeAgent && activeAgent.instructions) messagesToSend.push({role:'system', content:activeAgent.instructions});
    messagesToSend=messagesToSend.concat(conversation);
    const response=await fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},body:JSON.stringify({model:MODEL,messages:messagesToSend,stream:true,temperature:0.7})});
    removeTyping();
    if(!response.ok){const err=await response.json().catch(()=>({})); addMessage('assistant',err.message||err.detail||`Erreur ${response.status}`,true); isGenerating=false; enableInput(); return;}
    const bubble=addMessage('assistant',''); let fullContent=''; const reader=response.body.getReader(); const decoder=new TextDecoder(); let buffer='';
    while(true){const {done,value}=await reader.read(); if(done) break; buffer+=decoder.decode(value,{stream:true}); const lines=buffer.split('\n'); buffer=lines.pop()||''; for(const line of lines){const t=line.trim(); if(!t||!t.startsWith('data: ')) continue; const data=t.slice(6); if(data==='[DONE]') continue; try{const p=JSON.parse(data); const d=p.choices?.[0]?.delta?.content; if(d){fullContent+=d; bubble.textContent=fullContent; messagesEl.scrollTop=messagesEl.scrollHeight;}}catch{}}}
    if(fullContent) conversation.push({role:'assistant',content:fullContent}); else bubble.textContent='(Réponse vide)';
  }catch(err){removeTyping(); addMessage('assistant','Erreur réseau : '+err.message,true);}
  isGenerating=false; enableInput(); userInput.focus();
}
renderAgentList();
