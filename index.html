<!-- BusDirect V9 - Sauvegarde dalles + Direct Live corrigé SANS parcours complet -->
<!DOCTYPE html>
<html lang="fr">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BusDirect V9 - Dalles + Live corrigé sans parcours</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{const t=localStorage.getItem('bd_theme'); if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');}catch(e){}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;background:#FAFAF9;color:#18181b;min-height:100vh;max-width:640px;margin:0 auto;line-height:1.5;-webkit-font-smoothing:antialiased}
.dark body{background:#0A0A0B;color:#fafafa}
.header{position:sticky;top:0;z-index:40;height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid #e4e4e7;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.dark .header{background:rgba(24,24,27,.85);border-color:#27272a}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:28px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.dark .card{background:#18181b;border-color:#27272a}
.input{width:100%;height:56px;border-radius:9999px;background:#f4f4f5;border:1px solid transparent;outline:none;font-size:16px;font-weight:500;padding:0 44px}
.dark .input{background:#27272a;color:#fff}
.input:focus{border-color:#000;background:#fff}
.btn{border:none;border-radius:9999px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-black{background:#000;color:#fff}
.dark .btn-black{background:#fff;color:#000}
.live-card{border-left:6px solid #22c55e;background:#fff;border-radius:20px;padding:16px;border:1px solid #e4e4e7;display:flex;justify-content:space-between;align-items:center}
.dark .live-card{background:#18181b;border-color:#27272a}
.live-card.retard{border-left-color:#ef4444}
.hidden{display:none!important}
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.modal-box{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:32px 32px 0 0;max-height:90vh;overflow-y:auto;padding:24px;max-width:640px;margin:0 auto}
.dark .modal-box{background:#18181b}
.suggest{margin-top:8px;background:#fff;border:1px solid #e4e4e7;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.dark .suggest{background:#27272a;border-color:#3f3f46}
.suggest button{width:100%;text-align:left;padding:12px 16px;display:flex;gap:10px;align-items:center;border:none;background:transparent;border-bottom:1px solid #f4f4f5;cursor:pointer}
</style>
</head>
<body>
<header class="header">
<div style="display:flex;align-items:center;gap:8px">
<svg width="24" height="24" viewBox="0 0 24 16"><rect x="2" y="2" width="20" height="12" rx="3" fill="#2a2a2a"/><rect x="3" y="3" width="18" height="6" rx="1.5" fill="#e5e7eb"/><circle cx="7" cy="11.5" r="1.2" fill="#f5f5f5"/><circle cx="17" cy="11.5" r="1.2" fill="#f5f5f5"/></svg>
<b>BusDirect</b><span style="font-size:10px;background:#000;color:#fff;padding:2px 6px;border-radius:999px">V9</span>
</div>
<div style="display:flex;gap:8px">
<button id="btnLoc" class="btn btn-black" style="width:40px;height:40px;border-radius:50%">◎</button>
<button id="btnTheme" class="btn" style="width:40px;height:40px;border-radius:50%;border:1px solid #e4e4e7;background:#fff">🌙</button>
</div>
</header>

<div style="padding:16px;display:flex;flex-direction:column;gap:16px">
<div class="card">
<h2 style="font-weight:800;font-size:18px;margin-bottom:12px">Où aller ?</h2>
<div style="position:relative">
<span style="position:absolute;left:16px;top:50%;transform:translateY(-50%)">🔍</span>
<input id="ouAller" class="input" placeholder="Destination, arrêt..." autocomplete="off">
<button id="clearOuAller" class="btn hidden" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#e4e4e7">✕</button>
</div>
<div id="searchResults" class="hidden" style="margin-top:12px;display:flex;flex-direction:column;gap:8px"></div>
</div>

<div id="liveSection">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h3 style="font-weight:800;font-size:18px">Départs Live</h3>
<span style="font-size:11px;color:#71717a;background:#f4f4f5;padding:4px 8px;border-radius:999px">Live</span>
</div>
<div id="liveList" style="display:flex;flex-direction:column;gap:12px">
<div class="card" style="text-align:center;padding:32px"><div style="font-size:32px">🚌</div><div style="font-size:14px;color:#71717a;margin-top:8px">Entre une destination ou active ◎</div></div>
</div>
</div>

<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h3 style="font-weight:800;font-size:18px">Mes dalles</h3>
<button id="btnNewDalle" class="btn btn-black" style="font-size:13px;padding:8px 16px">+ Nouvelle</button>
</div>
<div id="dallesGrid" style="display:grid;gap:12px"></div>
</div>

<div class="card">
<h3 style="font-weight:800;margin-bottom:12px">🎫 Tickets SMS TL</h3>
<div id="smsList" style="display:flex;flex-wrap:wrap;gap:8px"></div>
<div style="margin-top:8px;font-size:11px;color:#71717a">788 → TL / TLC / TLJOUR • SMS classique</div>
</div>
</div>

<div id="modaleDalle" class="modal">
<div class="modal-bg" id="closeDalleBg"></div>
<div class="modal-box">
<div style="width:40px;height:6px;background:#d4d4d8;border-radius:999px;margin:0 auto 16px"></div>
<h3 style="font-weight:800;font-size:18px;margin-bottom:16px">Sauvegarder un trajet</h3>
<div style="display:flex;flex-direction:column;gap:16px">
<div>
<label style="font-size:11px;font-weight:700;color:#71717a;text-transform:uppercase">Départ</label>
<div style="position:relative;margin-top:6px">
<input id="dalleDepart" class="input" style="padding-left:16px;padding-right:88px" placeholder="Bourdonnette">
<button id="btnLocDepart" class="btn btn-black" style="position:absolute;right:48px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%">◎</button>
<button id="clearDepart" class="btn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:#e4e4e7">✕</button>
</div>
<div id="departSuggest" class="suggest hidden"></div>
</div>
<div>
<label style="font-size:11px;font-weight:700;color:#71717a;text-transform:uppercase">Arrivée</label>
<div style="position:relative;margin-top:6px">
<input id="dalleArrivee" class="input" style="padding-left:16px;padding-right:40px" placeholder="Gare CFF">
<button id="clearArrivee" class="btn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:#e4e4e7">✕</button>
</div>
<div id="arriveeSuggest" class="suggest hidden"></div>
</div>
<button id="btnSaveDalle" class="btn btn-black" style="width:100%;height:52px;border-radius:9999px;font-size:15px">💾 Enregistrer</button>
</div>
</div>
</div>

<script>
let bd_parcours=JSON.parse(localStorage.getItem('bd_parcours')||'[]');
let currentPos=null, isSelecting=false, abortCtrl=new AbortController(), debounceTimer=null;

function save(){localStorage.setItem('bd_parcours',JSON.stringify(bd_parcours)); renderDalles();}
document.getElementById('btnTheme').onclick=()=>{const d=document.documentElement.classList.toggle('dark'); localStorage.setItem('bd_theme',d?'dark':'light'); document.getElementById('btnTheme').textContent=d?'☀️':'🌙';};
document.getElementById('btnTheme').textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';

async function getPos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>{currentPos=p.coords; localStorage.setItem('bd_lastPos',JSON.stringify(p.coords)); res(p.coords);},rej,{enableHighAccuracy:true,timeout:15000}));}

document.getElementById('btnLoc').onclick=async()=>{try{const pos=await getPos(); const r=await fetch(`https://transport.opendata.ch/v1/locations?x=${pos.longitude}&y=${pos.latitude}&type=station`); const j=await r.json(); if(j.stations[0]) fetchLive(j.stations[0].name, j.stations[1]?.name||j.stations[0].name);}catch(e){alert('Géoloc refusée');}};
document.getElementById('btnLocDepart').onclick=async()=>{try{const pos=await getPos(); const rev=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.latitude}&lon=${pos.longitude}&format=json`); const j=await rev.json(); document.getElementById('dalleDepart').value=j.display_name.split(',')[0];}catch(e){}};

function setupSuggest(inputId,suggestId){
const input=document.getElementById(inputId); const box=document.getElementById(suggestId);
input.addEventListener('input',()=>{if(isSelecting) return; clearTimeout(debounceTimer); try{abortCtrl.abort();}catch{} abortCtrl=new AbortController(); const q=input.value.trim(); if(q.length<2){box.classList.add('hidden'); return;} debounceTimer=setTimeout(async()=>{try{const r=await fetch(`https://transport.opendata.ch/v1/locations?query=${encodeURIComponent(q)}&type=station`,{signal:abortCtrl.signal}); const j=await r.json(); box.innerHTML=j.stations.slice(0,5).map(s=>`<button data-name="${s.name}"><span>📍</span><div><div style="font-weight:700;font-size:14px">${s.name}</div><div style="font-size:11px;color:#71717a">${s.id||''}</div></div></button>`).join(''); box.classList.remove('hidden'); box.querySelectorAll('button').forEach(b=>b.onclick=()=>{isSelecting=true; abortCtrl.abort(); clearTimeout(debounceTimer); input.value=b.dataset.name; box.classList.add('hidden'); setTimeout(()=>isSelecting=false,600);});}catch(e){}},250);});
input.addEventListener('blur',()=>setTimeout(()=>box.classList.add('hidden'),250));
}
setupSuggest('dalleDepart','departSuggest'); setupSuggest('dalleArrivee','arriveeSuggest');

async function fetchLive(dep,arr){try{const r=await fetch(`https://transport.opendata.ch/v1/connections?from=${encodeURIComponent(dep)}&to=${encodeURIComponent(arr)}&limit=8`); const j=await r.json(); renderLive(j.connections,`${dep} → ${arr}`);}catch(e){document.getElementById('liveList').innerHTML=`<div style="text-align:center;padding:16px;color:#ef4444">Erreur live</div>`;}}
function renderLive(conns,title){
const list=document.getElementById('liveList');
if(!conns.length){list.innerHTML=`<div style="text-align:center;padding:16px;color:#71717a">Aucun départ pour ${title}</div>`; return;}
list.innerHTML=`<div style="font-size:11px;color:#71717a;margin-bottom:8px">${title}</div>`+conns.map(c=>{const sec=c.sections[0]; const prod=sec.journey?.number||c.products[0]||'?'; const delay=sec.journey?.delay||0; const depTime=new Date(c.from.departure); const isRetard=delay>2; const col=prod.includes('1')?'#00923F':'#E30613'; return `<div class="live-card ${isRetard?'retard':''}"><div style="display:flex;gap:12px;align-items:center"><span style="padding:6px 12px;border-radius:9999px;color:white;font-weight:800;font-size:13px;background:${col}">🚌 ${prod}</span><div><div style="font-weight:700;font-size:15px">${c.to.station.name}</div><div style="font-size:11px;color:#71717a">${depTime.toLocaleTimeString().slice(0,5)}</div></div></div><div style="text-align:right"><div style="font-weight:800;font-size:18px;${isRetard?'color:#ef4444':''}">${depTime.toLocaleTimeString().slice(0,5)}</div></div></div>`;}).join('');
}

function renderDalles(){
const grid=document.getElementById('dallesGrid');
if(bd_parcours.length===0){grid.innerHTML=`<div class="card" style="text-align:center;padding:32px"><div style="font-size:32px">🚌</div><div style="font-weight:700;margin-top:8px">Aucun trajet sauvegardé</div><button onclick="document.getElementById('btnNewDalle').click()" class="btn btn-black" style="margin-top:12px;padding:8px 16px;font-size:13px">Créer ma première dalle</button></div>`; return;}
grid.innerHTML=bd_parcours.map((d,i)=>`<div class="card" style="border-left:4px solid #00923F;padding:16px"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:700">${d.depart} → ${d.arrivee}</div></div><button onclick="fetchLive('${d.depart.replace(/'/g,"\\'")}','${d.arrivee.replace(/'/g,"\\'")}')" class="btn btn-black" style="padding:6px 12px;font-size:12px">Live</button></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="deleteDalle(${i})" class="btn" style="font-size:11px;border:1px solid #e4e4e7;padding:4px 10px;border-radius:9999px">🗑️</button></div></div>`).join('');
}
function deleteDalle(i){if(confirm('Supprimer ?')){bd_parcours.splice(i,1); save();}}
document.getElementById('btnNewDalle').onclick=()=>{document.getElementById('dalleDepart').value=''; document.getElementById('dalleArrivee').value=''; document.getElementById('modaleDalle').classList.add('open');};
document.getElementById('closeDalleBg').onclick=()=>document.getElementById('modaleDalle').classList.remove('open');
document.getElementById('btnSaveDalle').onclick=()=>{const dep=document.getElementById('dalleDepart').value.trim(); const arr=document.getElementById('dalleArrivee').value.trim(); if(!dep||!arr) return; bd_parcours.push({depart:dep,arrivee:arr}); save(); document.getElementById('modaleDalle').classList.remove('open'); fetchLive(dep,arr);};

document.getElementById('ouAller').addEventListener('input',(e)=>{
const q=e.target.value.trim();
document.getElementById('clearOuAller').classList.toggle('hidden',!q);
if(q.length>2){fetch(`https://transport.opendata.ch/v1/locations?query=${encodeURIComponent(q)}&type=station`).then(r=>r.json()).then(j=>{const box=document.getElementById('searchResults'); box.classList.remove('hidden'); box.style.display='flex'; box.innerHTML=j.stations.slice(0,5).map(s=>`<button onclick="selectOuAller('${s.name.replace(/'/g,"\\'")}')" style="width:100%;text-align:left;padding:12px 16px;background:white;border-radius:16px;border:1px solid #e4e4e7"><span>📍</span><b>${s.name}</b></button>`).join('');});}else{document.getElementById('searchResults').classList.add('hidden');}
});
function selectOuAller(name){document.getElementById('ouAller').value=name; document.getElementById('searchResults').classList.add('hidden'); getPos().then(pos=>fetch(`https://transport.opendata.ch/v1/locations?x=${pos.longitude}&y=${pos.latitude}&type=station`).then(r=>r.json()).then(j=>{if(j.stations[0]) fetchLive(j.stations[0].name,name);})).catch(()=>fetchLive('Lausanne',name));}
document.getElementById('clearOuAller').onclick=()=>{document.getElementById('ouAller').value=''; document.getElementById('searchResults').classList.add('hidden'); document.getElementById('clearOuAller').classList.add('hidden');};
document.getElementById('clearDepart').onclick=()=>{document.getElementById('dalleDepart').value='';};
document.getElementById('clearArrivee').onclick=()=>{document.getElementById('dalleArrivee').value='';};

const SMS=[{code:'TL',num:'788'},{code:'TLC',num:'788'},{code:'TLJOUR',num:'788'}];
function renderSMS(){document.getElementById('smsList').innerHTML=SMS.map(s=>`<div style="background:#f4f4f5;border-radius:9999px;padding:6px 12px;font-size:12px;display:flex;gap:8px;align-items:center"><b>${s.code}</b><span style="color:#71717a">${s.num}</span><button onclick="window.location.href='sms:${s.num}?&body=${s.code}'" class="btn btn-black" style="padding:4px 8px;font-size:11px">📲</button></div>`).join('');}
renderSMS();
renderDalles();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>console.log('SW ok'));}

</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
